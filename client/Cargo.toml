[package]
name = "terminal-client"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
web-sys = { version = "0.3", features = [
    "Window",
    "Document",
    "Element",
    "Node",
    "HtmlElement",
    "HtmlCanvasElement",
    "WebSocket",
    "MessageEvent",
    "BinaryType",
    "Storage",
    "Selection",
    "Range",
    "CanvasRenderingContext2d",
    "TextMetrics",
    "ImageData",
    "WebGl2RenderingContext",
    "WebGlBuffer",
    "WebGlProgram",
    "WebGlShader",
    "WebGlTexture",
    "WebGlUniformLocation",
    "console"
] }
js-sys = "0.3"
vt100 = "0.16"
serde_json = "1.0"
console_error_panic_hook = "0.1"
ab_glyph = "0.2"