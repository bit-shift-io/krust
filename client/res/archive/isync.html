<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>krust terminal probe</title>
<style>
html, body { margin: 0; height: 100%; }
canvas { display: block; }
</style>
</head>
<body id="body" style="background:#888">
<canvas id="terminal-canvas" width="800" height="600"></canvas>
<img id="hold" style="display:none" src="/demo/slow.png">
<script>
function dump(s){ console.log('[' + String(performance.now()|0) + 'ms] ' + s); }
function ping(s){ fetch('/demo/step?p=' + s).then(()=>{}).catch(()=>{}); }
const body = document.getElementById('body');
window.addEventListener('error', e => { dump('PAGEERR ' + e.message); body.style.background = '#f00'; });
window.addEventListener('unhandledrejection', e => { dump('REJECT ' + e.reason); body.style.background = '#f00'; });
(async () => {
    try {
    ping('start');
    const m = await import('../pkg/terminal_client.js');
    ping('glue');
    const resp = await fetch('../pkg/terminal_client_bg.wasm');
    ping('resp ' + resp.status);
    const bytes = await resp.arrayBuffer();
    ping('bytes ' + bytes.byteLength);
    const mod = await WebAssembly.compile(bytes);
    ping('compiled');
    const wasm = m.initSync(mod);
    ping('inst');
    const grid = wasm.diag_grid();
    const canvas = wasm.diag_canvas();
    const cell = wasm.diag_cell();
    ping('diag g=' + (grid>>>0).toString(16) + ' c=' + (canvas>>>0).toString(16) + ' cell=' + (cell>>>0).toString(16));
    body.style.background = '#f0f0f0';
    wasm.init('terminal-canvas', null);
    ping('init');
    body.style.background = '#f80';
    wasm.handle_resize(800, 600);
    ping('resize');
    const g = wasm.diag_grid();
    const c = wasm.diag_canvas();
    const ce = wasm.diag_cell();
    ping('diag2 g=' + (g>>>0).toString(16) + ' c=' + (c>>>0).toString(16) + ' cell=' + (ce>>>0).toString(16));
    wasm.process_bytes(new TextEncoder().encode('Hello World\x1b[31m red\x1b[0m'));
    ping('proc');
    const gl = document.getElementById('terminal-canvas').getContext('webgl2');
    const px = new Uint8Array(800 * 600 * 4);
    gl.readPixels(0, 0, 800, 600, gl.RGBA, gl.UNSIGNED_BYTE, px);
    let bright = 0, colored = 0;
    for (let i = 0; i < px.length; i += 4) {
        if (px[i] > 120 || px[i+1] > 120 || px[i+2] > 120) bright++;
        if (!(px[i] === px[i+1] && px[i+1] === px[i+2])) colored++;
    }
    ping('bright ' + bright + ' ' + colored);
    dump('bright=' + bright + ' colored=' + colored);
    body.style.background = bright > 100 ? '#0a0' : '#f00';
    dump('END ok');
    ping('end');
    } catch (e) {
        body.style.background = '#f00';
        ping('ERR ' + String(e));
        dump('ERR ' + e);
    }
})();
</script>
</body>
</html>
