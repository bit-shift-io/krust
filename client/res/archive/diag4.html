<!DOCTYPE html>
<html>
<head><meta charset="utf-8"><title>diag4</title>
<style>body{background:#111;color:#eee;font:12px monospace;padding:8px;}</style>
</head>
<body>
<pre id="out"></pre>
<script type="module">
    function log(m) {
        try { console.log(m); } catch (e) {}
        if (typeof window.dump === 'function') { try { window.dump(m + '\n'); } catch (e) {} }
    }
    const t0 = performance.now();
    const then = (m) => log('[' + Math.round(performance.now() - t0) + 'ms] ' + m);
    let ticks = 0;
    setInterval(() => { ticks++; then('tick ' + ticks); }, 1000);

    const origCS = WebAssembly.compileStreaming;
    const origC = WebAssembly.compile;
    const origIS = WebAssembly.instantiateStreaming;
    const origI = WebAssembly.instantiate;
    const origM = WebAssembly.Module;
    const origInst = WebAssembly.Instance;

    WebAssembly.compileStreaming = async function (resp, ...rest) {
        then('compileStreaming enter');
        try {
            const r = await origCS.call(this, resp, ...rest);
            then('compileStreaming done');
            return r;
        } catch (e) { then('compileStreaming threw: ' + e); throw e; }
    };
    WebAssembly.compile = async function (...args) {
        then('compile enter (async)');
        const r = await origC.apply(this, args);
        then('compile done (async)');
        return r;
    };
    WebAssembly.instantiateStreaming = async function (...args) {
        then('instantiateStreaming enter');
        try {
            const r = await origIS.apply(this, args);
            then('instantiateStreaming done');
            return r;
        } catch (e) { then('instantiateStreaming threw: ' + e); throw e; }
    };
    WebAssembly.instantiate = async function (...args) {
        then('instantiate enter (async)');
        const isSync = args.length === 2 && typeof args[0] === 'function';
        try {
            const r = await origI.apply(this, args);
            then('instantiate done (async)');
            return r;
        } catch (e) { then('instantiate async threw: ' + e); throw e; }
    };

    let m;
    try {
        then('importing glue');
        m = await import('../pkg/terminal_client.js');
        then('glue imported');
    } catch (e) {
        log('GLUE IMPORT FAILED: ' + e);
    }
    try {
        then('calling default()');
        await m.default();
        then('default() resolved');
    } catch (e) {
        log('default() REJECTED: ' + e);
    }
    try {
        then('calling version() ' + m.version());
    } catch (e) {
        log('version failed: ' + e);
    }
    then('page end');
</script>
</body>
</html>
