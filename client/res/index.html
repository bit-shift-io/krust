<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%232b2b2b'/%3E%3Cpath d='M8 10L14 16L8 22' stroke='%23f0f0f0' stroke-width='2.5' stroke-linecap='round' stroke-linejoin='round' fill='none'/%3E%3Cline x1='16' y1='22' x2='24' y2='22' stroke='%23f0f0f0' stroke-width='2.5' stroke-linecap='round'/%3E%3C/svg%3E">
    <title>krust terminal</title>
    <style>
        html, body { margin: 0; height: 100%; background: #111; overflow: hidden; }
        canvas { display: block; width: 100%; height: 100%; background: #000; }
        #status { position: fixed; top: 8px; right: 8px; z-index: 10; font: 12px monospace; color: #0f0; background: rgba(0,0,0,0.7); padding: 4px 8px; opacity: 1; transition: opacity 0.5s ease-in-out; }
        body.done { background: #0a0; }
        body.done.fail { background: #a00; }
    </style>
</head>
<body>
    <canvas id="terminal-canvas" width="800" height="600" tabindex="0"></canvas>
    <div id="status">loading...</div>
    <script src="./krust_runtime.js"></script>
    <script type="module">
         import ping from './ping.js';
         const status = document.getElementById('status');
        const canvas = document.getElementById('terminal-canvas');
        const params = new URLSearchParams(location.search);
        let sid = params.get('s') || params.get('session') || (Math.random().toString(36).substring(2, 6));

        // Reflect session ID in URL without reloading so you can bookmark/copy standard links
        const reflected = params.get('s') || params.get('session');
        if (reflected !== sid) {
            const newUrl = new URL(window.location);
            newUrl.searchParams.set('s', sid);
            newUrl.searchParams.delete('session');
            window.history.replaceState({}, '', newUrl);
        }
        let statusTimeout = null;
        function showStatus(message) {
            status.textContent = message;
            status.style.display = 'block';
            status.style.opacity = '1';
            if (statusTimeout) clearTimeout(statusTimeout);
            statusTimeout = setTimeout(() => {
                status.style.opacity = '0';
            }, 4000);
        }

        // Load raw WASM module directly, with the "krust" FFI import module
        const wasmResp = await fetch('../pkg/terminal_client_bg.wasm');
        const wasmBytes = await wasmResp.arrayBuffer();
        const wasm = await WebAssembly.instantiate(wasmBytes, window.KRUST_RUNTIME.imports);
        window.KRUST_RUNTIME.install(wasm.instance.exports.memory);
        const { init, process_bytes, handle_resize, handle_click, version, alloc, dealloc, free_result, free_string } = wasm.instance.exports;
        const mem = wasm.instance.exports.memory;

        function readString(ptr, len) {
            return new TextDecoder().decode(new Uint8Array(mem.buffer, ptr, len));
        }

        try {
            ping('start');
            // Initialize terminal
            const canvasIdBytes = new TextEncoder().encode('terminal-canvas');
            const canvasIdPtr = alloc(canvasIdBytes.length);
            new Uint8Array(mem.buffer, canvasIdPtr, canvasIdBytes.length).set(canvasIdBytes);
            const boxPtr = init(canvasIdPtr, canvasIdBytes.length);
            dealloc(canvasIdPtr, canvasIdBytes.length);
            if (boxPtr === 0) throw new Error('init returned null');
            const boxView = new Uint8Array(mem.buffer, boxPtr, 8);
            const verBytes = boxView[0] | (boxView[1]<<8) | (boxView[2]<<16) | (boxView[3]<<24);
            const verLen = boxView[4] | (boxView[5]<<8) | (boxView[6]<<16) | (boxView[7]<<24);
            const ver = readString(verBytes, verLen);
            free_string(verBytes);
            free_result(boxPtr);
            ping('init');
            handle_resize(800, 600);
            canvas.addEventListener('click', (e) => {
                const rect = canvas.getBoundingClientRect();
                const x = e.clientX - rect.left;
                const y = e.clientY - rect.top;
                handle_click(Math.round(x), Math.round(y));
            });
            canvas.style.pointerEvents = 'auto';
            const testBytes = new TextEncoder().encode('Hello World\x1b[31m red\x1b[0m');
            const testPtr = alloc(testBytes.length);
            new Uint8Array(mem.buffer, testPtr, testBytes.length).set(testBytes);
            const summaryPtr = process_bytes(testPtr, testBytes.length);
            dealloc(testPtr, testBytes.length);
            if (summaryPtr !== 0) free_result(summaryPtr);
            ping('proc');
            document.body.className = 'done';
            showStatus(ver + ' PASS');
        } catch (e) {
            document.body.className = 'done fail';
            showStatus('ERR ' + e);
            ping('err ' + e);
        }
    </script>
</body>
</html>
