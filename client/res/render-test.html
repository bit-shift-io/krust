<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>krust render test</title>
    <style>
        html, body { margin: 0; background: #111; overflow: hidden; }
        canvas { display: block; width: 800px; height: 600px; background: #000; }
        #result { position: fixed; top: 8px; left: 8px; z-index: 10;
                  font: 11px monospace; color: #0f0; background: rgba(0,0,0,0.85);
                  padding: 6px 10px; white-space: pre; max-width: 1000px; }
        body.fail #result { color: #f66; }
    </style>
</head>
<body>
    <canvas id="terminal-canvas" width="800" height="600" tabindex="0"></canvas>
    <pre id="result">loading...</pre>
    <script type="module">
        import init, { init as term_init, process_bytes, repaint, handle_resize, version } from '../pkg/terminal_client.js';

        const canvas = document.getElementById('terminal-canvas');
        const result = document.getElementById('result');

        function setResult(obj) {
            result.textContent = JSON.stringify(obj);
            document.body.className = obj.pass ? '' : 'fail';
            document.title = 'krust-render-test ' + (obj.pass ? 'PASS' : 'FAIL');
        }

        function feedContent() {
            const parts = [];
            const push = (s) => parts.push(new TextEncoder().encode(s));
            push('\x1b[2J\x1b[H');
            push('\x1b[1;34mboldblue\x1b[0m\r\n');
            push('─'.repeat(80) + '\r\n');
            for (let i = 0; i < 6; i++) push('│'.repeat(40) + '\r\n');
            push(' '.repeat(30) + '⠋⠁⠂⠄⠈⠐⠠⡀\r\n');
            for (let i = 0; i < 8; i++) push('█'.repeat(10) + '\r\n');
            const len = parts.reduce((n, p) => n + p.length, 0);
            const joined = new Uint8Array(len);
            let off = 0;
            for (const p of parts) { joined.set(p, off); off += p.length; }
            process_bytes(joined);
        }

        // Seam analysis: every line in a region should be uniformly bright.
        // A "dim" row/column = its max channel brightness in the region never
        // reaches FG level, i.e. an AA/background gap between glyph cells.
        function analyzeArea(W, H, img, x0, y0, x1, y1, pane) {
            const scale = 200;
            const dimRows = [], dimCols = [], sample = [];
            for (let y = y0; y < y1; y++) {
                let mx = 0;
                for (let x = x0; x < x1; x++) {
                    const i = 4 * (y * W + x);
                    const v = Math.max(img[i], img[i + 1], img[i + 2]);
                    if (v > mx) mx = v;
                }
                if (mx < scale) dimRows.push(y);
                if (y === y0 || y === y0 + 1) sample.push(mx);
            }
            for (let x = x0; x < x1; x++) {
                let mx = 0;
                for (let y = y0; y < y1; y++) {
                    const i = 4 * (y * W + x);
                    const v = Math.max(img[i], img[i + 1], img[i + 2]);
                    if (v > mx) mx = v;
                }
                if (mx < scale) dimCols.push(x);
            }
            return { pane, dimRows, dimCols, sample, x0, y0, x1, y1, scale };
        }
        function seamSummary(a) {
            return { rows: a.dimRows.length, cols: a.dimCols.length,
                     rowPx: a.dimRows.length, colPx: a.dimCols.length };
        }

        async function run() {
            const bytes = await (await fetch('../pkg/terminal_client_bg.wasm')).arrayBuffer();
            await init(bytes);
            const config = JSON.parse(term_init('terminal-canvas', null));
            handle_resize(800, 600);
            feedContent();
            repaint();

            const W = canvas.width, H = canvas.height;
            const cw = config.cell_width, ch = config.cell_height;

            // Read the rendered frame. Under the WebGL2 renderer the canvas has
            // no 2D context (only one context type per canvas), so read back
            // via readPixels (bottom-up, flipped here to top-down). Under the
            // Canvas 2D path use getImageData as before.
            const rows = Math.floor(H / ch);
            let img = null;
            let yoff = 0;
            const gl = canvas.getContext('webgl2');
            if (gl) {
                // The WebGL2 renderer draws a grid of rows*cell_h pixels,
                // bottom-aligned in the GL framebuffer. When the canvas is
                // taller than the grid (800x600 canvas vs 33*18=594), the grid
                // lands at img y in [yoff, H) after the flip below.
                yoff = H - rows * ch;
                const px = new Uint8Array(W * H * 4);
                gl.readPixels(0, 0, W, H, gl.RGBA, gl.UNSIGNED_BYTE, px);
                img = new Uint8Array(W * H * 4);
                for (let y = 0; y < H; y++) {
                    const src = (H - 1 - y) * W * 4;
                    img.set(px.subarray(src, src + W * 4), y * W * 4);
                }
            } else {
                // Canvas 2D draws top-down from pixel 0, so yoff stays 0.
                const ctx2d = canvas.getContext('2d');
                img = ctx2d ? ctx2d.getImageData(0, 0, W, H).data : null;
            }
            if (!img) {
                setResult({ pass: false, error: 'no canvas context available for pixel readback' });
                return;
            }

            function isBright(x, y) {
                if (x < 0 || y < 0 || x >= W || y >= H) return false;
                const i = 4 * (y * W + x);
                if (img[i + 3] === 0) return false;
                return img[i] > 100 || img[i + 1] > 100 || img[i + 2] > 100;
            }

            // boldblue sits on row 0, so scan only the first cell row.
            let brightBlue = 0, darkBlue = 0;
            for (let y = yoff; y < yoff + ch; y++) {
                for (let x = 0; x < 120; x += 2) {
                    if (!isBright(x, y)) continue;
                    const i = 4 * (y * W + x);
                    if (img[i + 2] > 170 && img[i] > 40 && Math.abs(img[i] - img[i + 1]) < 50) brightBlue++;
                    if (img[i + 2] > 170 && img[i] < 20 && img[i + 1] < 20) darkBlue++;
                }
            }

            const R = Math.round;
            const dash = analyzeArea(W, H, img, 0, yoff + ch, R(80 * cw), yoff + 2 * ch, 'dash');
            const pipe = analyzeArea(W, H, img, 0, yoff + 2 * ch, R(40 * cw), yoff + 8 * ch, 'pipe');
            const blk = analyzeArea(W, H, img, 0, yoff + 9 * ch, R(10 * cw), yoff + 17 * ch, 'block');

            const res = {
                metrics: { cell_width: cw, cell_height: ch, yoff, grid_rows: rows },
                colors: { bright_blue_pixels: brightBlue, dark_blue_pixels: darkBlue },
                dash: seamSummary(dash),
                pipe: seamSummary(pipe),
                block: seamSummary(blk),
                version: version(),
            };
            // dash/pipe/block: a dim *column* in the dash row means a vertical
            // seam between two horizontally-adjacent ─ cells; a dim *row* in the
            // pipe column means a horizontal seam between two │ cells. Thin bars
            // legitimately leave whole lines empty, so only the cross-axis
            // (the one the glyph spans) is asserted. █ covers the whole cell,
            // so both axes are asserted there.
            res.pass = brightBlue > 0 && darkBlue === 0
                && dash.dimCols.length === 0
                && pipe.dimRows.length === 0
                && blk.dimRows.length === 0 && blk.dimCols.length === 0;
            setResult(res);
        }

        run().catch((e) => setResult({ pass: false, error: String(e) }));
    </script>
</body>
</html>
