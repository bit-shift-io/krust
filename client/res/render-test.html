<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>krust render test</title>
    <style>
        html, body { margin: 0; background: #111; overflow: hidden; }
        canvas { display: block; width: 800px; height: 600px; background: #000; }
        #result { position: fixed; top: 8px; left: 8px; z-index: 10;
                  font: 11px monospace; color: #0f0; background: rgba(0,0,0,0.85);
                  padding: 6px 10px; white-space: pre; max-width: 1000px; }
        body.fail #result { color: #f66; }
    </style>
</head>
<body>
    <canvas id="terminal-canvas" width="800" height="600" tabindex="0"></canvas>
    <pre id="result">loading...</pre>
    <script src="./krust_runtime.js"></script>
    <script type="module">
        const tStart = performance.now();
        const wasm = await WebAssembly.instantiate(
            await (await fetch('/pkg/terminal_client_bg.wasm')).arrayBuffer(),
            window.KRUST_RUNTIME.imports
        );
        window.KRUST_RUNTIME.install(wasm.instance.exports.memory);
        const tInst = performance.now();
        const { init, set_renderer_mode, set_system_font, process_bytes, repaint, handle_resize, version,
                alloc, dealloc, free_memory, free_string, free_result } = wasm.instance.exports;
        const mem = wasm.instance.exports.memory;

        const canvas = document.getElementById('terminal-canvas');
        const result = document.getElementById('result');

        function setResult(obj) {
            result.textContent = JSON.stringify(obj);
            document.body.className = obj.pass ? '' : 'fail';
            document.title = 'krust-render-test ' + (obj.pass ? 'PASS' : 'FAIL');
        }

        function readString(ptr, len) {
            return new TextDecoder().decode(new Uint8Array(mem.buffer, ptr, len));
        }

        // Call an export that returns a boxed [u32; 2] holding (data_ptr, data_len)
        // and free the pair once fully read.
        function callBoxedExport(fn, ...args) {
            const boxPtr = fn(...args);
            if (boxPtr === 0) return null;
            const view = new Uint8Array(mem.buffer, boxPtr, 8);
            const dataPtr = view[0] | (view[1] << 8) | (view[2] << 16) | (view[3] << 24);
            const dataLen = view[4] | (view[5] << 8) | (view[6] << 16) | (view[7] << 24);
            free_result(boxPtr);
            return { dataPtr, dataLen };
        }

        function feedContent() {
            const parts = [];
            const push = (s) => parts.push(new TextEncoder().encode(s));
            push('\x1b[2J\x1b[H');
            push('\x1b[1;34mboldblue\x1b[0m\r\n');
            push('─'.repeat(80) + '\r\n');
            for (let i = 0; i < 6; i++) push('│'.repeat(40) + '\r\n');
            push(' '.repeat(30) + '⠋⠁⠂⠄⠈⠐⠠⡀\r\n');
            for (let i = 0; i < 8; i++) push('█'.repeat(10) + '\r\n');
            push('T'.repeat(10) + '\r\n');
            push('g'.repeat(10) + '\r\n');
            push('_'.repeat(10) + '\r\n');
            push('x'.repeat(10) + '\r\n');
            push(' '.repeat(30) + '▮▍▎▏▪▸●◆\r\n');
            push(' '.repeat(30) + '↻↺⇦⋯⊶✦✶✔\r\n');
            const len = parts.reduce((n, p) => n + p.length, 0);
            const joined = new Uint8Array(len);
            let off = 0;
            for (const p of parts) { joined.set(p, off); off += p.length; }
            const ptr = alloc(joined.length);
            new Uint8Array(mem.buffer, ptr, joined.length).set(joined);
            const summary = process_bytes(ptr, joined.length);
            dealloc(ptr, joined.length);
            if (summary !== 0) free_result(summary);
        }

        // Seam analysis: every line in a region should be uniformly bright.
        // A "dim" row/column = its max channel brightness in the region never
        // reaches FG level, i.e. an AA/background gap between glyph cells.
        function analyzeArea(W, H, img, x0, y0, x1, y1, pane) {
            const scale = 200;
            const dimRows = [], dimCols = [], sample = [];
            for (let y = y0; y < y1; y++) {
                let mx = 0;
                for (let x = x0; x < x1; x++) {
                    const i = 4 * (y * W + x);
                    const v = Math.max(img[i], img[i + 1], img[i + 2]);
                    if (v > mx) mx = v;
                }
                if (mx < scale) dimRows.push(y);
                if (y === y0 || y === y0 + 1) sample.push(mx);
            }
            for (let x = x0; x < x1; x++) {
                let mx = 0;
                for (let y = y0; y < y1; y++) {
                    const i = 4 * (y * W + x);
                    const v = Math.max(img[i], img[i + 1], img[i + 2]);
                    if (v > mx) mx = v;
                }
                if (mx < scale) dimCols.push(x);
            }
            return { pane, dimRows, dimCols, sample, x0, y0, x1, y1, scale };
        }
        function seamSummary(a) {
            return { rows: a.dimRows.length, cols: a.dimCols.length,
                     rowPx: a.dimRows.length, colPx: a.dimCols.length };
        }

        async function run() {
            const params = new URLSearchParams(location.search);
            const r = params.get('r');
            set_renderer_mode(r === 'gl' ? 1 : r === '2d' ? 2 : 0);
            const canvasIdBytes = new TextEncoder().encode('terminal-canvas');
            const canvasIdPtr = alloc(canvasIdBytes.length);
            new Uint8Array(mem.buffer, canvasIdPtr, canvasIdBytes.length).set(canvasIdBytes);
            const initRet = callBoxedExport(init, canvasIdPtr, canvasIdBytes.length);
            dealloc(canvasIdPtr, canvasIdBytes.length);
            if (!initRet) {
                setResult({ pass: false, error: 'init returned null' });
                return;
            }
            const config = JSON.parse(readString(initRet.dataPtr, initRet.dataLen));
            free_string(initRet.dataPtr);
            const tInit = performance.now();
            handle_resize(800, 600);
            const tResize = performance.now();

            // Mirror production (server.html): swap the embedded Hack atlas for
            // the system monospace font the 2D reference paints with, so the GL
            // checks test the font that actually ships.
            const tFont0 = performance.now();
            try {
                const fr = await fetch('/system-font');
                if (fr.ok) {
                    const sb = new Uint8Array(await fr.arrayBuffer());
                    const sp = alloc(sb.length);
                    if (sp) {
                        new Uint8Array(mem.buffer, sp, sb.length).set(sb);
                        set_system_font(sp, sb.length);
                        dealloc(sp, sb.length);
                    }
                }
            } catch (_) {}
            const tFont = performance.now();

            feedContent();
            const tFeed = performance.now();
            repaint();
            const tRepaint = performance.now();

            const W = canvas.width, H = canvas.height;
            const cw = config.cell_width, ch = config.cell_height;

            // Read the rendered frame. Under the WebGL2 renderer the canvas has
            // no 2D context (only one context type per canvas), so read back
            // via readPixels (bottom-up, flipped here to top-down). The GL and
            // Canvas 2D renderers share the same top-down layout: row 0 sits at
            // the canvas top, so yoff = 0 for both.
            const rows = Math.floor(H / ch);
            let yoff = 0;
            let gl = null;
            function readFrame() {
                // Read the rendered frame. Under the WebGL2 renderer the canvas
                // has no 2D context (only one context type per canvas), so read
                // back via readPixels (bottom-up, flipped here to top-down). The
                // GL and Canvas 2D renderers share the same top-down layout:
                // row 0 sits at the canvas top, so yoff = 0 for both.
                gl = gl || canvas.getContext('webgl2');
                if (gl) {
                    const px = new Uint8Array(W * H * 4);
                    gl.readPixels(0, 0, W, H, gl.RGBA, gl.UNSIGNED_BYTE, px);
                    const out = new Uint8Array(W * H * 4);
                    for (let y = 0; y < H; y++) {
                        const src = (H - 1 - y) * W * 4;
                        out.set(px.subarray(src, src + W * 4), y * W * 4);
                    }
                    return out;
                }
                // Canvas 2D draws top-down from pixel 0, so yoff stays 0.
                const ctx2d = canvas.getContext('2d');
                return ctx2d ? ctx2d.getImageData(0, 0, W, H).data : null;
            }
            let img = readFrame();
            if (!img) {
                setResult({ pass: false, error: 'no canvas context available for pixel readback' });
                return;
            }
            const tRead = performance.now();

            function isBright(x, y) {
                if (x < 0 || y < 0 || x >= W || y >= H) return false;
                const i = 4 * (y * W + x);
                if (img[i + 3] === 0) return false;
                return img[i] > 100 || img[i + 1] > 100 || img[i + 2] > 100;
            }

            // boldblue sits on row 0, so scan only the first cell row.
            let brightBlue = 0, darkBlue = 0;
            for (let y = yoff; y < yoff + ch; y++) {
                for (let x = 0; x < 120; x += 2) {
                    if (!isBright(x, y)) continue;
                    const i = 4 * (y * W + x);
                    if (img[i + 2] > 170 && img[i] > 40 && Math.abs(img[i] - img[i + 1]) < 50) brightBlue++;
                    if (img[i + 2] > 170 && img[i] < 20 && img[i + 1] < 20) darkBlue++;
                }
            }

            // Text glyph check: "boldblue" is 8 cells on row 0. A working text
            // pass paints glyph ink in EVERY cell; a broken pass (blank atlas,
            // wrong UVs, degenerate texture) leaves cells empty. Count bright
            // pixels per cell and require visible ink in each one.
            const perCellInk = [];
            for (let c = 0; c < 8; c++) {
                const x0 = Math.round(c * cw);
                const x1 = Math.round((c + 1) * cw);
                let ink = 0;
                for (let y = yoff; y < yoff + ch; y++) {
                    for (let x = x0; x < x1; x++) {
                        if (!isBright(x, y)) continue;
                        const i = 4 * (y * W + x);
                        if (img[i + 2] > 170 && img[i] > 40 && Math.abs(img[i] - img[i + 1]) < 50) ink++;
                    }
                }
                perCellInk.push(ink);
            }
            const textMinInk = perCellInk.length ? Math.min.apply(null, perCellInk) : 0;
            const textCellsWithInk = perCellInk.filter(n => n > 8).length;
            const textOk = textCellsWithInk === 8;

            const R = Math.round;
            const dash = analyzeArea(W, H, img, 0, yoff + ch, R(80 * cw), yoff + 2 * ch, 'dash');
            const pipe = analyzeArea(W, H, img, 0, yoff + 2 * ch, R(40 * cw), yoff + 8 * ch, 'pipe');
            const blk = analyzeArea(W, H, img, 0, yoff + 9 * ch, R(10 * cw), yoff + 17 * ch, 'block');

            // Braille (row 8, cols 30..37) and block/geometric cursor glyphs
            // (row 21, cols 30..37) must each paint some ink in every cell.
            // These are the characters TUI spinners/cursors animate; when the
            // glyph atlas misses a range the cells render as pure background.
            function rowInkPerCell(rowIdx, colStart, colEnd) {
                const cells = [];
                for (let c = colStart; c < colEnd; c++) {
                    const x0 = R(c * cw), x1 = R((c + 1) * cw);
                    let ink = 0;
                    for (let y = yoff + rowIdx * ch; y < yoff + (rowIdx + 1) * ch; y++) {
                        for (let x = x0; x < x1; x++) if (isBright(x, y)) ink++;
                    }
                    cells.push(ink);
                }
                return cells;
            }
            const brailleInk = rowInkPerCell(8, 30, 38);
            const geoInk = rowInkPerCell(21, 30, 38);
            const symbolInk = rowInkPerCell(22, 30, 38);
            const brailleOk = brailleInk.filter(n => n > 0).length === 8;
            const geoOk = geoInk.filter(n => n > 0).length === 8;
            const symbolOk = symbolInk.filter(n => n > 0).length === 8;

            // Orientation: 'T' has a horizontal bar at its TOP and a thin stem
            // descending below. If glyphs are mirrored across the horizontal
            // axis the bar lands at the bottom of the cell instead. (An
            // underscore can't detect this — it is symmetric under that mirror.)
            const uy0 = yoff + 17 * ch, uy1 = yoff + 18 * ch;
            const upBand = uy0 + 0.3 * ch, loBand = uy0 + 0.7 * ch;
            let topInk = 0, bottomInk = 0;
            for (let y = uy0; y < uy1; y++) {
                for (let x = 0; x < R(10 * cw); x++) {
                    if (!isBright(x, y)) continue;
                    if (y <= upBand) topInk++;
                    else if (y >= loBand) bottomInk++;
                }
            }
            const orientOk = topInk > bottomInk;

            // Baseline: a descender ('g') must reach the BOTTOM of its cell and
            // an underscore must sit in the bottom band. When every glyph was
            // glued to the slot top, 'g' left the whole bottom of its cell
            // empty and '_' appeared near the top instead of at the baseline.
            const gy0 = yoff + 18 * ch, gy1 = gy0 + ch;
            const gyLo = gy0 + 0.7 * ch;
            let descInk = 0, usInk = 0;
            for (let y = gy0; y < gy1; y++) {
                for (let x = 0; x < R(10 * cw); x++) {
                    if (!isBright(x, y)) continue;
                    if (y >= gyLo) descInk++;
                }
            }
            const uy0b = yoff + 19 * ch, uy1b = uy0b + ch;
            const uLo = uy0b + 0.7 * ch;
            for (let y = uy0b; y < uy1b; y++) {
                for (let x = 0; x < R(10 * cw); x++) {
                    if (!isBright(x, y)) continue;
                    if (y >= uLo) usInk++;
                }
            }
            const baselineOk = descInk > 0 && usInk > 0;

            // Vertical ink extents (top/bottom rows within the cell) for one
            // glyph per probe row. render-check.sh compares these across the
            // gl and 2d renderers to verify text sits at the same height in
            // both (the "gl is out of alignment" report was gl glyphs parked
            // at the cell top instead of vertically centered like the 2D path).
            function glyphExtent(rowIdx, colCount) {
                const y0 = yoff + rowIdx * ch, y1 = y0 + ch;
                let top = -1, bottom = -1;
                for (let y = y0; y < y1; y++) {
                    let ink = false;
                    for (let x = 0; x < R(colCount * cw); x++) {
                        if (isBright(x, y)) { ink = true; break; }
                    }
                    if (ink) { if (top < 0) top = y - y0; bottom = y - y0; }
                }
                return { top, bottom };
            }
            const align = {
                T: glyphExtent(17, 10),
                g: glyphExtent(18, 10),
                _: glyphExtent(19, 10),
                x: glyphExtent(20, 10),
            };

            // Animation probe: writing two consecutive opencode spinner frames
            // (⠋ then ⠙) to the same cell must change the rendered pixel
            // signature. A frozen spinner (atlas slots that collapse to the
            // same bitmap, e.g. Hack's braille at an 8px em) keeps the buffer
            // byte-identical, so this distinguishes a live spinner from a
            // static glyph.
            function writeCell(str) {
                const b = new TextEncoder().encode('\x1b[23;1H' + str);
                const p = alloc(b.length);
                new Uint8Array(mem.buffer, p, b.length).set(b);
                const s = process_bytes(p, b.length);
                dealloc(p, b.length);
                if (s !== 0) free_result(s);
            }
            function cellSig(rowIdx, colIdx) {
                const x0 = R(colIdx * cw), x1 = R((colIdx + 1) * cw);
                const y0 = yoff + rowIdx * ch;
                const s = [];
                for (let y = y0; y < y0 + ch; y++) {
                    for (let x = x0; x < x1; x++) {
                        const i = 4 * (y * W + x);
                        s.push(img[i], img[i + 1], img[i + 2]);
                    }
                }
                return s;
            }
            writeCell('⠋'); repaint();
            img = readFrame();
            const f1Ink = cellSig(22, 0).filter(v => v > 100).length;
            const sig1 = cellSig(22, 0);
            writeCell('⠙'); repaint();
            img = readFrame();
            const f2Ink = cellSig(22, 0).filter(v => v > 100).length;
            const sig2 = cellSig(22, 0);
            let frameDeltas = 0;
            for (let i = 0; i < sig1.length; i++) if (sig1[i] !== sig2[i]) frameDeltas++;
            const animateOk = frameDeltas > 0 && f1Ink > 0 && f2Ink > 0;

            const res = {
                metrics: { cell_width: cw, cell_height: ch, yoff, grid_rows: rows },
                colors: { bright_blue_pixels: brightBlue, dark_blue_pixels: darkBlue },
                text: { min_ink_per_cell: textMinInk, cells_with_ink: textCellsWithInk },
                orient: { top_band_ink: topInk, bottom_band_ink: bottomInk },
                baseline: { descender_ink: descInk, underscore_ink: usInk },
                align: align,
                timing: {
                    fetch_ms: Math.round(tInst - tStart),
                    instantiate_ms: Math.round(tInit - tInst),
                    init_ms: Math.round(tResize - tInit),
                    resize_ms: Math.round(tFont0 - tResize),
                    font_ms: Math.round(tFont - tFont0),
                    feed_ms: Math.round(tRepaint - tFeed),
                    repaint_ms: Math.round(tRead - tRepaint),
                    total_ms: Math.round(tRead - tStart),
                },
                dash: seamSummary(dash),
                pipe: seamSummary(pipe),
                block: seamSummary(blk),
                braille: { cells_with_ink: brailleInk.filter(n => n > 0).length },
                blockgeo: { cells_with_ink: geoInk.filter(n => n > 0).length },
                symbols: { cells_with_ink: symbolInk.filter(n => n > 0).length },
                animate: { frame_deltas: frameDeltas, frame_ink: [f1Ink, f2Ink] },
                version: (() => {
                    const v = callBoxedExport(version);
                    if (!v) return '';
                    const s = readString(v.dataPtr, v.dataLen);
                    free_string(v.dataPtr);
                    return s;
                })(),
            };
            // dash/pipe/block: a dim *column* in the dash row means a vertical
            // seam between two horizontally-adjacent ─ cells; a dim *row* in the
            // pipe column means a horizontal seam between two │ cells. Thin bars
            // legitimately leave whole lines empty, so only the cross-axis
            // (the one the glyph spans) is asserted. █ covers the whole cell,
            // so both axes are asserted there.
            res.pass = brightBlue > 0 && darkBlue === 0
                && textOk
                && orientOk
                && baselineOk
                && brailleOk
                && geoOk
                && symbolOk
                && animateOk
                && dash.dimCols.length === 0
                && pipe.dimRows.length === 0
                && blk.dimRows.length === 0 && blk.dimCols.length === 0;
            setResult(res);
        }

        run().catch((e) => setResult({ pass: false, error: String(e) }));
    </script>
</body>
</html>
