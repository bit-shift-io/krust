<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%232b2b2b'/%3E%3Cpath d='M8 10L14 16L8 22' stroke='%23f0f0f0' stroke-width='2.5' stroke-linecap='round' stroke-linejoin='round' fill='none'/%3E%3Cline x1='16' y1='22' x2='24' y2='22' stroke='%23f0f0f0' stroke-width='2.5' stroke-linecap='round'/%3E%3C/svg%3E">
    <title>krust terminal</title>
    <style>
        html, body { margin: 0; height: 100%; background: #2b2b2b; user-select: none; -webkit-user-select: none; overflow: hidden; }
        canvas { display: block; width: 100%; height: 100%; background: #2b2b2b; touch-action: none; }
        #status { position: fixed; top: 8px; right: 8px; z-index: 10; font: 12px monospace; color: #f0f0f0; background: rgba(0,0,0,0.7); padding: 4px 8px; opacity: 1; transition: opacity 0.5s ease-in-out; }
        #scrollbar { position: fixed; top: 0; right: 0; width: 10px; height: 100%; z-index: 8; background: rgba(255,255,255,0.06); opacity: 0; transition: opacity 0.2s ease-in-out; }
        #scrollbar.hidden { visibility: hidden; pointer-events: none; }
        #scrollbar:hover, body.scrolling #scrollbar { opacity: 1; }
        #scrollbar-thumb { position: absolute; left: 1px; right: 1px; border-radius: 4px; background: rgba(255,255,255,0.4); }
        canvas.bell { animation: bell-flash 0.15s ease-out; }
        @keyframes bell-flash { from { filter: brightness(2.2); } to { filter: brightness(1); } }
        #render-error { position: fixed; top: 0; left: 0; right: 0; z-index: 20; font: 11px monospace; color: #ffe0e0; background: rgba(120,10,10,0.92); padding: 3px 8px; display: none; }
        #render-error.visible { display: block; }
    </style>
</head>
<body>
    <canvas id="terminal-canvas"></canvas>
    <div id="scrollbar" class="hidden"><div id="scrollbar-thumb"></div></div>
    <div id="status">connecting...</div>
    <div id="render-error"></div>
    <script src="/krust_runtime.js"></script>
    <script type="module">
        // Load raw WASM module directly via WebAssembly JS API. The import
        // object is provided by krust_runtime.js (the hand-written "krust"
        // FFI module); no wasm-bindgen glue is involved.
        const wasm = await WebAssembly.instantiateStreaming(
            fetch('/pkg/terminal_client_bg.wasm'),
            window.KRUST_RUNTIME.imports
        );
        window.KRUST_RUNTIME.install(wasm.instance.exports.memory);
        const { init, set_renderer_mode, rebuild_webgl, process_bytes, query_replies, handle_resize, repaint,
                blink_tick, sync_pending, flush_sync,
                webgl_context_lost, reset_terminal,
                key_to_bytes, set_selection, selected_text, clear_selection,
                scroll, scroll_to, scroll_to_bottom, scroll_to_top,
                scroll_offset, scrollback_len, is_alt_screen, grid_metrics, version,
                mouse_event, mouse_tracking, application_cursor,
                paste_bytes, focus_reporting, take_bell, hyperlink_at, take_clipboard,
                take_cwd, take_prompt_mark,
                free_memory, free_string, free_result, alloc, dealloc } = wasm.instance.exports;

        // WASM memory. Views are constructed fresh from mem.buffer on every
        // use because the buffer detaches when WASM memory grows.
        const mem = wasm.instance.exports.memory;

        // Read a (ptr, len) pair from WASM memory and return a JS string
        function readString(ptr, len) {
            const bytes = new Uint8Array(mem.buffer, ptr, len);
            const s = new TextDecoder().decode(bytes);
            return s;
        }

        // Read a (ptr, len) pair from WASM memory and return a Uint8Array copy
        function readBytesCopy(ptr, len) {
            const bytes = new Uint8Array(mem.buffer, ptr, len);
            return new Uint8Array(bytes); // copy
        }

        // Call an export that returns a boxed [u32; 2] containing (data_ptr, data_len)
        // Returns {data: Uint8Array|string, freeFn: function} where freeFn frees the boxed pair
        // For strings, data is a JS string and freeFn should free the string memory
        // For bytes, data is a Uint8Array copy and freeFn should free the bytes memory
        function exportBoxedPair(ptr) {
            // ptr points to Box<[u32; 2]>
            const view = new Uint8Array(mem.buffer, ptr, 8);
            const dataPtr = view[0] | (view[1] << 8) | (view[2] << 16) | (view[3] << 24);
            const dataLen = view[4] | (view[5] << 8) | (view[6] << 16) | (view[7] << 24);
            return { dataPtr, dataLen, boxPtr: ptr };
        }

        // Call an export that returns a string (as boxed pair) and returns JS string
        function callStringExport(fn, ...args) {
            const boxPtr = fn(...args);
            if (boxPtr === 0) return "";
            const { dataPtr, dataLen, boxPtr: box } = exportBoxedPair(boxPtr);
            const str = readString(dataPtr, dataLen);
            // Free the string memory
            free_string(dataPtr);
            // Free the boxed pair
            free_result(box);
            return str;
        }

        // Call an export that returns bytes (as boxed pair) and returns Uint8Array copy
        function callBytesExport(fn, ...args) {
            const boxPtr = fn(...args);
            if (boxPtr === 0) return new Uint8Array(0);
            const { dataPtr, dataLen, boxPtr: box } = exportBoxedPair(boxPtr);
            const bytes = readBytesCopy(dataPtr, dataLen);
            // Free the bytes memory
            free_memory(dataPtr, dataLen);
            // Free the boxed pair
            free_result(box);
            return bytes;
        }

        // Call an export that returns void
        function callVoidExport(fn, ...args) {
            fn(...args);
        }

        // Render loop for frame coalescing
        let renderScheduled = false;
        // When `renderScheduled` last flipped; the blink interval uses this to
        // catch a rAF that the browser throttled or dropped entirely (see below).
        let lastScheduleAt = 0;
        // Stall timer for ?2026 synchronized output (see handleWsData).
        let syncFlushTimer = null;
        function scheduleRender() {
            // Browsers suspend requestAnimationFrame for hidden tabs, so a
            // frame scheduled while hidden paints long after the fact, for
            // nothing. Skip it: the focus/visibilitychange handlers already
            // do a full repaint on the way back. Staying out of the way also
            // leaves the main thread free to drain the WebSocket, and a
            // client that drains promptly is what keeps the server from
            // dropping frames on it.
            if (document.hidden) return;
            if (!renderScheduled) {
                renderScheduled = true;
                lastScheduleAt = performance.now();
                requestAnimationFrame(() => {
                    renderScheduled = false;
                    try { repaint(); } catch (e) { reportRenderError(e); }
                });
            }
        }

        const params = new URLSearchParams(location.search);
        const sid = params.get('s') || params.get('session') || (Math.random().toString(36).substring(2, 6));
        const startDir = params.get('dir');
        // OSC 52 lets an application replace the system clipboard, which is a
        // security-sensitive capability (a hostile program could clobber a
        // password you just copied). It stays off unless explicitly enabled.
        const clipboardOptIn = params.get('clipboard') === '1';

        const reflected = params.get('s') || params.get('session');
        if (reflected !== sid) {
            const newUrl = new URL(window.location);
            newUrl.searchParams.set('s', sid);
            newUrl.searchParams.delete('session');
            window.history.replaceState({}, '', newUrl);
        }

        function buildWsUrl(path) {
            const wsParams = new URLSearchParams({ s: sid });
            if (startDir) wsParams.set('dir', startDir);
            return path + '?' + wsParams.toString();
        }

        let ws = null;

        // Open WebSocket early — parallel with WASM compilation.
        // sendResize() is gated on wasmReady + ws.readyState, so it fires
        // automatically once both are up.
        connectPrimary(buildWsUrl('/ws'));

        function extractTitle(bytes) {
            let out = null;
            let i = 0;
            while (i < bytes.length) {
                if (bytes[i] === 0x1b && i + 1 < bytes.length && bytes[i + 1] === 0x5d) {
                    let k = i + 2;
                    while (k < bytes.length && bytes[k] !== 0x07 && !(bytes[k - 1] === 0x1b && bytes[k] === 0x5c)) {
                        k++;
                    }
                    const seq = bytes.subarray(i + 2, k);
                    const str = new TextDecoder().decode(seq);
                    const sep = str.indexOf(';');
                    if (sep !== -1) {
                        const param = str.slice(0, sep);
                        if (param === '0' || param === '2') {
                            out = str.slice(sep + 1);
                        }
                    }
                    i = k + (k < bytes.length ? 1 : 0);
                } else {
                    i++;
                }
            }
            return out;
        }

        const status = document.getElementById('status');
        const canvas = document.getElementById('terminal-canvas');

        // Recover from WebGL context loss (Firefox drops the context while the
        // tab is hidden). `preventDefault()` opts into the browser restoring
        // the context; without it the context is lost permanently and the
        // terminal freezes as a blank canvas until reload. On restore, the
        // browser has invalidated every GL object krust holds, so the whole
        // WebGL2 renderer (program, buffers, glyph atlas) must be rebuilt
        // before the next frame can paint anything.
        canvas.addEventListener('webglcontextlost', (e) => {
            e.preventDefault();
            try { repaint(); } catch (_) {}
        });
        canvas.addEventListener('webglcontextrestored', () => {
            try { rebuild_webgl(); } catch (_) {}
            try { fit(); } catch (_) {}
        });

        let lastTitle = 'krust | terminal';
        let lastCwd = '';
        let lastRenderTime = 0;

        // Full repaint of everything when the tab comes back. `repaint` is
        // mark_all_dirty + render, i.e. a complete redraw from the parser
        // state rather than a diff — which is what we want after a stretch
        // where nothing was drawn. Rebuild the renderer first if the WebGL
        // context was dropped while hidden: painting into a lost context is a
        // silent no-op, so without this the tab can come back blank.
        function repaintOnReturn() {
            try {
                if (webgl_context_lost() === 1) rebuild_webgl();
            } catch (e) { reportRenderError(e); }
            try { repaint(); } catch (e) { reportRenderError(e); }
        }

        // Focus in/out reports (DECSET 1004). Sent as ESC[I / ESC[O only when
        // the running app asked for them; harmless otherwise.
        function sendFocusReport(focused) {
            try {
                if (focus_reporting() !== 1) return;
            } catch (_) {
                return;
            }
            if (ws && ws.readyState === 1) {
                ws.send(new TextEncoder().encode(focused ? '\x1b[I' : '\x1b[O'));
            }
        }
        window.addEventListener('blur', () => sendFocusReport(false));

        // Visual bell: a brief brightness flash when the app rings BEL (0x07)
        // or sends the visual-bell escape. No audio by default — browsers
        // block autoplay and an uninvited beep is worse than silence.
        let bellTimer = null;
        function flashBell() {
            if (!canvas) return;
            canvas.classList.remove('bell');
            void canvas.offsetWidth; // restart the animation on rapid bells
            canvas.classList.add('bell');
            if (bellTimer) clearTimeout(bellTimer);
            bellTimer = setTimeout(() => {
                canvas.classList.remove('bell');
                bellTimer = null;
            }, 200);
        }

        window.addEventListener('focus', () => {
            document.title = lastTitle;
            sendFocusReport(true);
            fit();
            const now = performance.now();
            if (now - lastRenderTime > 32) {
                lastRenderTime = now;
                repaintOnReturn();
            }
            // Reset prev_screen to None so the dirty cell mechanism starts
            // with a fresh state after the tab has been hidden, rather than
            // comparing against stale state from before the hide.
            try { reset_prev_screen(); } catch (_) {}
        });
        document.addEventListener('visibilitychange', () => {
            if (!document.hidden) {
                fit();
                repaintOnReturn();
                // Reset prev_screen to None so the dirty cell mechanism starts
                // with a fresh state after the tab has been hidden, rather than
                // comparing against stale state from before the hide.
                try { reset_prev_screen(); } catch (_) {}
            }
        });
        if ('IntersectionObserver' in window) {
            const observer = new IntersectionObserver((entries) => {
                const entry = entries[entries.length - 1];
                if (entry.isIntersecting && entry.intersectionRatio > 0) {
                    fit();
                    repaintOnReturn();
                }
            }, { threshold: 0 });
            observer.observe(canvas);
        }
        setInterval(() => {
            if (!document.hidden) {
                // Flip the DECSCUSR blink phase (no-op unless the app chose
                // a blinking cursor style), then repaint the frame.
                try { blink_tick(); repaint(); } catch (e) { reportRenderError(e); }
                // If a frame was scheduled but its rAF has not fired within
                // well over an interval, the browser dropped or throttled the
                // callback (rAF can stall under frame-rate limiting while the
                // tab stays visible). Run the coalesced repaint here instead —
                // otherwise `renderScheduled` stays set and every future
                // scheduleRender() early-returns, wedging the screen on its
                // last painted frame.
                if (renderScheduled && performance.now() - lastScheduleAt > 400) {
                    renderScheduled = false;
                    try { repaint(); } catch (e) { reportRenderError(e); }
                }
            }
        }, 500);

        // A swallowed wasm exception inside a render call used to leave the
        // framebuffer presenting its last good frame while the grid moved on,
        // with nothing on the console. Surface any such failure as a visible
        // strip so a rare glitch is captured on screen instead of silently
        // disappearing; the strip clears itself after a while.
        let renderErrorCount = 0;
        let renderErrorTimer = null;
        function reportRenderError(e) {
            renderErrorCount++;
            const msg = e && e.message ? e.message : String(e);
            console.error('krust render error', msg);
            const el = document.getElementById('render-error');
            if (el) {
                el.textContent = 'krust render error (' + renderErrorCount + '): ' + msg;
                el.classList.add('visible');
            }
            if (renderErrorTimer) clearTimeout(renderErrorTimer);
            renderErrorTimer = setTimeout(() => {
                const strip = document.getElementById('render-error');
                if (strip) strip.classList.remove('visible');
            }, 10000);
        }
        window.addEventListener('error', (e) => {
            reportRenderError(e && e.message ? e.message : String(e));
        });
        window.addEventListener('unhandledrejection', (e) => {
            reportRenderError('unhandled rejection: ' + (e && e.reason ? String(e.reason) : ''));
        });

        let statusTimeout = null;
        function showStatus(message) {
            status.textContent = message;
            status.style.display = 'block';
            status.style.opacity = '1';
            if (statusTimeout) clearTimeout(statusTimeout);
            statusTimeout = setTimeout(() => {
                status.style.opacity = '0';
            }, 4000);
        }

        let cellW = 8;
        let cellH = 18;
        let gridCols = 80;
        let gridRows = 24;
        let gridX = 0;
        let gridY = 0;
        let wasmReady = false;
        let wsQueue = [];
        let selAnchor = null;
        let selDragging = false;
        let selMoved = false;
        // Pointer-capture state for mouse reporting. Declared with the other
        // shared state, not down with the mouse handlers: `handleIncoming`
        // runs during the post-init queue flush, which is earlier in source
        // order than the handlers, and its Reset branch touches these.
        let mousePhase = 'idle'; // 'capture' | 'select' | 'idle'
        let lastMotion = null;   // motion debounce: one report per cell/button/mods
        let curScroll = 0;
        let scrollbarVisible = false;
        let bytesIn = 0;
        let benchGoal = parseInt(params.get('bench') || '0', 10);
        let benchMax = 0;
        let benchSum = 0;
        let benchN = 0;
        let benchT0 = 0;
        let benchAt = 0;
        let benchHex = 0;
        let fpsFrames = 0;
        let fpsAt = 0;
        let quietTimer = null;

        function benchReset() {
            benchN = 0;
            benchMax = 0;
            benchSum = 0;
            benchAt = performance.now();
            quietTimer = null;
        }

        function benchSample(dt) {
            if (benchGoal <= 0) return;
            benchN += 1;
            if (dt > benchMax) benchMax = dt;
            benchSum += dt;
            fpsFrames += 1;
            const now = performance.now();
            if (fpsFrames >= 60) {
                const dt60 = now - fpsAt;
                if (dt60 > 0) {
                    console.log('FPS', Math.floor(60000 / dt60));
                    fpsFrames = 0;
                    fpsAt = now;
                }
            }
            if (quietTimer) clearTimeout(quietTimer);
            quietTimer = setTimeout(() => {
                benchGoal = 0;
                console.log('BENCH_DONE', JSON.stringify({
                    n: benchN, maxMs: benchMax, avgMs: benchN > 0 ? benchSum / benchN : 0,
                    bytesIn: bytesIn, wallMs: performance.now() - benchAt
                }));
            }, 600);
        }
        let reconnectAttempts = 0;

        const isMac = navigator.platform.toUpperCase().indexOf('MAC') >= 0;

        // `window.devicePixelRatio` already folds in browser zoom (a 120% zoom
        // makes a 1x display report 1.2), and the wasm module reads the same
        // value. Do not clamp it here: the canvas backing store and the grid
        // fit have to be derived from the same number, or a clamped buffer with
        // an unclamped fit lays the grid out wider than the canvas.
        const devicePixelRatio = () => Math.max(1, window.devicePixelRatio || 1);

        function fit() {
            const dpr = devicePixelRatio();
            canvas.width = Math.round(window.innerWidth * dpr);
            canvas.height = Math.round(window.innerHeight * dpr);
            canvas.style.width = window.innerWidth + 'px';
            canvas.style.height = window.innerHeight + 'px';
            handle_resize(window.innerWidth, window.innerHeight);
            syncGrid();
        }

        // Pull the fitted grid size and centered origin back from the wasm
        // module, which owns the fit so the renderers and the PTY agree.
        function syncGrid() {
            const raw = callStringExport(grid_metrics);
            if (!raw) return;
            const m = JSON.parse(raw);
            gridRows = m.rows;
            gridCols = m.cols;
            gridX = m.x;
            gridY = m.y;
        }

        function sendResize() {
            if (!wasmReady || !ws || ws.readyState !== 1) return;
            const msg = { type: 'Resize', cols: gridCols, rows: gridRows, pixel_width: window.innerWidth, pixel_height: window.innerHeight };
            ws.send(JSON.stringify(msg));
        }

        function cellFromPoint(px, py) {
            const rect = canvas.getBoundingClientRect();
            const col = Math.max(0, Math.min(gridCols - 1, Math.floor((px - rect.left - gridX) / cellW)));
            const row = Math.max(0, Math.min(gridRows - 1, Math.floor((py - rect.top - gridY) / cellH)));
            return { row, col };
        }

        const scrollbarEl = document.getElementById('scrollbar');
        const scrollbarThumb = document.getElementById('scrollbar-thumb');

        function updateScrollbar() {
            const max = scrollback_len();
            const cur = curScroll;
            const total = max + gridRows;
            const viewport = gridRows;
            const thumbH = Math.max(24, viewport / total * 100);
            const trackH = 100 - thumbH;
            const pos = cur === 0 ? 100 - thumbH : (total - viewport - cur) / (total - viewport) * trackH;
            scrollbarThumb.style.height = thumbH + '%';
            scrollbarThumb.style.top = pos + '%';
            scrollbarEl.style.height = 'calc(100% - 2px)';
            // Only offer the scrollbar when there is genuinely something to
            // scroll to, and never while a full-screen TUI owns the alternate
            // screen — those apps manage their own scrolling. (vt100 also builds
            // the alternate grid with zero scrollback, so `max` is already 0
            // there; the explicit check keeps the intent readable and holds if
            // that ever changes.)
            const scrollable = max > 0 && !is_alt_screen();
            if (scrollable !== scrollbarVisible) {
                scrollbarVisible = scrollable;
                scrollbarEl.classList.toggle('hidden', !scrollable);
                if (!scrollable) {
                    document.body.classList.remove('scrolling');
                    clearTimeout(scrollbarEl._hideTimer);
                }
            }
        }

        function showScrollbarTemporarily() {
            if (!scrollbarVisible) return;
            document.body.classList.add('scrolling');
            clearTimeout(scrollbarEl._hideTimer);
            scrollbarEl._hideTimer = setTimeout(() => {
                document.body.classList.remove('scrolling');
            }, 1500);
        }

        function doScroll(delta) {
            curScroll = scroll(delta);
            updateScrollbar();
            showScrollbarTemporarily();
        }

        function doScrollTo(offset) {
            curScroll = scroll_to(offset);
            updateScrollbar();
            showScrollbarTemporarily();
        }

        function doScrollTop() {
            scroll_to_top();
            curScroll = scroll_offset();
            updateScrollbar();
            showScrollbarTemporarily();
        }

        function doScrollBottom() {
            scroll_to_bottom();
            curScroll = 0;
            updateScrollbar();
        }

        // Read init result: init returns a pointer to [u32; 2] containing (json_ptr, json_len)
        // Cell dimensions are measured fresh on every visit. A cached value
        // keyed only on DPR can be stale (fonts load lazily, render settings
        // change) and a stale cell size puts both the grid layout and the
        // mouse cell mapping off on every future visit at the same DPR.

        const rParam = params.get('r');
        set_renderer_mode(rParam === 'gl' ? 1 : rParam === '2d' ? 2 : 0);

        const canvasIdBytes = new TextEncoder().encode('terminal-canvas');
        const canvasIdPtr = alloc(canvasIdBytes.length);
        const wasmBuf = new Uint8Array(mem.buffer, canvasIdPtr, canvasIdBytes.length);
        wasmBuf.set(canvasIdBytes);
        const boxPtr = init(canvasIdPtr, canvasIdBytes.length, 0, 0);
        dealloc(canvasIdPtr, canvasIdBytes.length);
        let rendererName = null;
        if (boxPtr === 0) {
            gridCols = 80;
            gridRows = 24;
            cellW = 8;
            cellH = 18;
        } else {
            const { dataPtr, dataLen, boxPtr: box } = exportBoxedPair(boxPtr);
            const str = readString(dataPtr, dataLen);
            free_string(dataPtr);
            free_result(box);
            const cfg = JSON.parse(str);
            gridCols = cfg.cols || 80;
            gridRows = cfg.rows || 24;
            cellW = Math.max(1, cfg.cell_width || 8);
            cellH = Math.max(1, cfg.cell_height || 18);
            rendererName = cfg.renderer || null;
        }

        fit();
        updateScrollbar();
        window.addEventListener('resize', () => { fit(); sendResize(); updateScrollbar(); });
        showStatus('krust terminal' + (rendererName ? ' (' + (rendererName === 'gl' ? 'GL' : '2D') + ')' : ''));
        wasmReady = true;
        sendResize(); // fire if ws is already connected
        // Frames that arrived before init() completed (the WebSocket opens
        // before the wasm module is ready, so the first history-replay burst
        // can race init) were queued instead of being fed to process_bytes.
        // Flush them now that the terminal state exists.
        for (let i = 0; i < wsQueue.length; i++) handleIncoming(wsQueue[i]);
        wsQueue = [];

        const proto = location.protocol === 'https:' ? 'wss' : 'ws';
        const st = params.get('selftest');
        if (st) {
            // Regression harness for the per-frame `process_bytes` cost: feed a
            // synthetic trace in 1024-byte chunks (the server's old PTY read
            // size) and report max/avg ms alongside the scrollback that built
            // up. Run it at the requested size and at 10x that, because the
            // cost used to scale with scrollback — the second run must not be
            // dramatically slower than the first once the clone-per-frame bug
            // is fixed. `firstMs`/`lastMs` show growth within a single trace.
            const runSelftest = (rows) => {
                const line = new TextEncoder().encode('X'.repeat(80) + '\n');
                const chunk = new Uint8Array(line.length * rows);
                for (let i = 0; i < rows; i++) chunk.set(line, i * line.length);
                const t0 = performance.now();
                let mx = 0, sum = 0, N = 0, firstMs = 0, lastMs = 0;
                for (let off = 0; off < chunk.length; off += 1024) {
                    const t = performance.now();
                    const sub = chunk.subarray(off, Math.min(off + 1024, chunk.length));
                    const subPtr = alloc(sub.length);
                    new Uint8Array(mem.buffer, subPtr, sub.length).set(sub);
                    const summaryPtr = process_bytes(subPtr, sub.length);
                    dealloc(subPtr, sub.length);
                    if (summaryPtr !== 0) free_result(summaryPtr);
                    scheduleRender();
                    const dt = performance.now() - t;
                    if (N === 0) firstMs = dt;
                    lastMs = dt;
                    if (dt > mx) mx = dt;
                    sum += dt; N++;
                }
                console.log('SELFTEST', JSON.stringify({ rows, gridRows, gridCols, innerW: window.innerWidth, innerH: window.innerHeight, dpr: window.devicePixelRatio, N, maxMs: mx, avgMs: sum / N, firstMs, lastMs, wallMs: performance.now() - t0, bytesIn: bytesIn, scrollbackLen: scrollback_len(), offset: scroll_offset() }));
            };
            const base = Math.max(1, parseInt(st, 10) || 200);
            // Reset parser state between runs so the second trace starts from
            // a clean screen but the scrollback comparison stays honest.
            runSelftest(base);
            runSelftest(base * 10);
        }

        // Route one inbound WebSocket payload. Control frames arrive as text;
        // PTY output as binary. Both can land before init() has finished, in
        // which case the payload is queued and replayed through here once the
        // terminal state exists. Declared at this scope (not inside
        // connectPrimary) because the post-init queue flush needs it too.
        function handleIncoming(data) {
            if (typeof data === 'string') {
                let msg = null;
                try { msg = JSON.parse(data); } catch (_) {}
                if (!msg || msg.type !== 'Reset') return;
                // The server's retained window has moved past this client's
                // position, so no contiguous tail exists to bring the grid up
                // to date. Drop the parser state; the retained log that
                // follows starts on an ESC boundary and rebuilds the screen.
                // A reset also wipes the app's private modes, so any pointer
                // capture ends here rather than waiting for a mouseup that
                // may never come (the parser was rebuilt underneath us).
                mousePhase = 'idle';
                lastMotion = null;
                if (wasmReady) {
                    try { reset_terminal(); } catch (_) {}
                    scheduleRender();
                } else {
                    wsQueue.push(data);
                }
                return;
            }
            if (!wasmReady) {
                wsQueue.push(data);
                return;
            }
            handleWsData(data);
        }

        function handleWsData(ev) {
            bytesIn += ev.byteLength;
            const inData = new Uint8Array(ev);
            const byteLen = inData.length;
            const bytePtr = alloc(byteLen);
            const wasmBuf = new Uint8Array(mem.buffer, bytePtr, byteLen);
            wasmBuf.set(inData);
            const boxPtr = query_replies(bytePtr, byteLen);
            dealloc(bytePtr, byteLen);
            if (boxPtr !== 0) {
                const { dataPtr, dataLen, box } = exportBoxedPair(boxPtr);
                const reps = readBytesCopy(dataPtr, dataLen);
                free_memory(dataPtr, dataLen);
                free_result(box);
                if (reps.length && ws && ws.readyState === 1) ws.send(reps);
            }
            const t0 = performance.now();
            if (params.get('benchskip') !== '1') {
                const inPtr = alloc(inData.length);
                new Uint8Array(mem.buffer, inPtr, inData.length).set(inData);
                const summaryPtr = process_bytes(inPtr, inData.length);
                dealloc(inPtr, inData.length);
                if (summaryPtr !== 0) free_result(summaryPtr);
                scheduleRender();
                // ?2026 synchronized output: wasm holds a frame's bytes
                // until its end marker arrives so a render never lands
                // mid-frame. If that end marker never comes (torn frame,
                // dropped chunks), force-feed after 300 ms instead of
                // freezing the screen.
                try {
                    if (sync_pending()) {
                        if (syncFlushTimer === null) {
                            syncFlushTimer = setTimeout(() => {
                                syncFlushTimer = null;
                                try { flush_sync(); console.log('krust sync stall flush'); } catch (_) {}
                                scheduleRender();
                            }, 300);
                        }
                    } else if (syncFlushTimer !== null) {
                        clearTimeout(syncFlushTimer);
                        syncFlushTimer = null;
                    }
                } catch (_) {}
            }
            benchSample(performance.now() - t0);
            try { if (take_bell() === 1) flashBell(); } catch (_) {}
            // OSC 52: honour an application clipboard request only when the
            // user opted in via ?clipboard=1. Always drain it so a disabled
            // clipboard never accumulates payloads.
            try {
                const b64 = callStringExport(take_clipboard);
                if (b64 && clipboardOptIn) {
                    const bin = atob(b64);
                    const bytes = Uint8Array.from(bin, (c) => c.charCodeAt(0));
                    navigator.clipboard
                        .writeText(new TextDecoder().decode(bytes))
                        .then(() => showStatus('clipboard set'), () => {});
                }
            } catch (_) {}
            // OSC 7 shell integration: remember the cwd so the tab title can
            // fall back to it when the app sets no OSC 2 title. OSC 133 prompt
            // marks are drained here for future jump-to-prompt support.
            try {
                const cwd = callStringExport(take_cwd);
                if (cwd) {
                    lastCwd = cwd;
                    const title = extractTitle(inData);
                    if (!title) {
                        let name = cwd;
                        try {
                            const path = new URL(cwd).pathname.replace(/\/+$/, '');
                            name = path.slice(path.lastIndexOf('/') + 1) || '/';
                        } catch (_) {}
                        lastTitle = name + ' | terminal';
                        document.title = lastTitle;
                    }
                }
            } catch (_) {}
            try { take_prompt_mark(); } catch (_) {}
            curScroll = scroll_offset();
            updateScrollbar();
            const title = extractTitle(inData);
            if (title) {
                lastTitle = title + ' | terminal';
                document.title = lastTitle;
            }
        }

        function connectPrimary(url) {
            ws = new WebSocket(url);
            ws.binaryType = 'arraybuffer';
            ws.onopen = () => {
                reconnectAttempts = 0;
                if (params.get('echo') === '1') {
                    ws.send(new TextEncoder().encode('echo K_RUST_WIRED\r'));
                }
                try { sendResize(); } catch (_) {} // no-op during early TDZ (pre-init)
                const p = params.get('paste');
                if (p) {
                    const unit = 'X'.repeat(1024) + '\n';
                    sendPaste(unit.repeat(parseInt(p, 10)));
                }
                const b = params.get('bench');
                if (b) {
                    benchGoal = parseInt(b, 10);
                    benchReset();
                    fpsAt = performance.now();
                    ws.send(new TextEncoder().encode('seq 1 ' + b + '\r'));
                }
            };
            ws.onmessage = (ev) => handleIncoming(ev.data);

            ws.onerror = () => { showStatus('ws error'); };
            ws.onclose = () => {
                showStatus('ws closed');
                const delay = Math.min(1000 * Math.pow(2, reconnectAttempts++), 8000);
                showStatus('reconnecting in ' + delay + 'ms');
                setTimeout(() => connectPrimary(url), delay);
            };
        }

        window.addEventListener('keydown', (e) => {
            const modifier = isMac ? e.metaKey : e.ctrlKey;

            if (e.key === 'PageUp' && !modifier && !e.altKey) {
                e.preventDefault();
                if (ws && ws.readyState === 1) ws.send(new TextEncoder().encode('\x1b[5~'));
                return;
            }
            if (e.key === 'PageDown' && !modifier && !e.altKey) {
                e.preventDefault();
                if (ws && ws.readyState === 1) ws.send(new TextEncoder().encode('\x1b[6~'));
                return;
            }

            if (e.key === 'Enter' && e.shiftKey && !e.ctrlKey && !e.altKey && !e.metaKey) {
                e.preventDefault();
                if (ws && ws.readyState === 1) ws.send(new TextEncoder().encode('\x1b\r'));
                return;
            }

            if (e.key === 'Enter' && modifier && !e.shiftKey && !e.altKey) {
                e.preventDefault();
                if (ws && ws.readyState === 1) ws.send(new TextEncoder().encode('\x1b[13;5u'));
                return;
            }

            if (modifier && e.key.toLowerCase() === 'c' && !e.altKey) {
                if (e.shiftKey) return;
                const text = callStringExport(selected_text);
                if (text) {
                    e.preventDefault();
                    navigator.clipboard.writeText(text).then(() => {
                        showStatus('copied ' + text.length + ' chars');
                    });
                    return;
                }
            }

            const isShiftInsert = e.shiftKey && e.key === 'Insert';
            const isCtrlShiftV = modifier && e.shiftKey && e.key.toLowerCase() === 'v';
            const isMacCmdV = isMac && e.metaKey && e.key.toLowerCase() === 'v';

            if (isShiftInsert || isCtrlShiftV || isMacCmdV) {
                e.preventDefault();
                if (ws && ws.readyState === 1) {
                    navigator.clipboard.readText().then(text => {
                        if (text) {
                            const data = new TextEncoder().encode(text);
                            ws.send(data);
                        }
                    }).catch(err => {
                        console.warn("Clipboard read permission denied or unavailable", err);
                    });
                }
                return;
            }

            if (modifier && e.shiftKey && e.key.toLowerCase() === 'a') {
                e.preventDefault();
                set_selection(0, 0, gridRows - 1, gridCols - 1);
                repaint();
                return;
            }

            if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'v') {
                return;
            }

            // Map key to PTY bytes
            const keyBytes = new TextEncoder().encode(e.key);
            const keyPtr = alloc(keyBytes.length);
            const wasmKeyBuf = new Uint8Array(mem.buffer, keyPtr, keyBytes.length);
            wasmKeyBuf.set(keyBytes);
            const bytesPtr = key_to_bytes(keyPtr, keyBytes.length, e.ctrlKey, e.altKey, e.shiftKey, e.metaKey);
            dealloc(keyPtr, keyBytes.length);
            if (bytesPtr !== 0) {
                const { dataPtr, dataLen, boxPtr } = exportBoxedPair(bytesPtr);
                const bytes = readBytesCopy(dataPtr, dataLen);
                free_memory(dataPtr, dataLen);
                free_result(boxPtr);
                if (bytes.length > 0) {
                    e.preventDefault();
                    if (ws && ws.readyState === 1) ws.send(bytes);
                }
            }
        });

        // Paste goes out as a single frame. WebSocket/TCP already provide flow
        // control, so interposing a timer only costs time: the old 4 KB-per-16 ms
        // throttle stretched a 1 MB paste to roughly four seconds. The wrapper
        // (ESC[200~/ESC[201~) is applied by the wasm module when the app enabled
        // bracketed paste, so embedded newlines are inserted literally.
        function sendPaste(text) {
            const data = new TextEncoder().encode(text);
            if (data.length === 0) return;
            const textPtr = alloc(data.length);
            new Uint8Array(mem.buffer, textPtr, data.length).set(data);
            const bytesPtr = paste_bytes(textPtr, data.length);
            dealloc(textPtr, data.length);
            if (bytesPtr === 0) return;
            const { dataPtr, dataLen, boxPtr } = exportBoxedPair(bytesPtr);
            const bytes = readBytesCopy(dataPtr, dataLen);
            free_memory(dataPtr, dataLen);
            free_result(boxPtr);
            if (bytes.length > 0 && ws && ws.readyState === 1) ws.send(bytes);
        }

        window.addEventListener('paste', (e) => {
            const text = e.clipboardData ? e.clipboardData.getData('text') : '';
            e.preventDefault();
            sendPaste(text);
        });

        // --- Mouse reporting --------------------------------------------------
        // Whether the pointer belongs to the application is decided by the
        // xterm mouse modes the app enabled (9 / 1000 / 1002 / 1003) — state
        // that lives on the vt100 screen inside the wasm module and is
        // updated as the app's output is parsed. The page keeps no copy: it
        // asks `mouse_tracking()` on every decision and asks `mouse_event()`
        // for the report bytes of every event, falling back to its own
        // selection/scrolling behaviour when no bytes come back. That split
        // mirrors xterm, which disables its selection service outright while
        // a protocol is active and offers Shift as the way back to native
        // selection.
        const MOUSE_PRESS = 0, MOUSE_RELEASE = 1, MOUSE_MOTION = 2, MOUSE_WHEEL = 3;
        const MOD_SHIFT = 1, MOD_ALT = 2, MOD_CTRL = 4;
        // mousePhase ('capture' = the app owns the pointer, 'select' = a
        // native selection drag, 'idle' = nothing in progress) and
        // lastMotion live with the shared selection state above.

        function mouseMods(e) {
            return (e.shiftKey ? MOD_SHIFT : 0) | (e.altKey ? MOD_ALT : 0) | (e.ctrlKey ? MOD_CTRL : 0);
        }

        // Held button from `e.buttons` (xterm derives the drag button the
        // same way): 0/1/2 = left/middle/right, 3 = none.
        function heldButton(e) {
            const b = e.buttons || 0;
            if (b & 1) return 0;
            if (b & 4) return 1;
            if (b & 2) return 2;
            return 3;
        }

        // Send one event to the app. Returns true when a report went out.
        function sendMouseEvent(kind, button, cell, e) {
            const bytes = callBytesExport(mouse_event, kind, button, cell.col + 1, cell.row + 1, mouseMods(e));
            if (bytes.length === 0) return false;
            // A press/release/wheel at a cell invalidates the motion
            // debounce: the next move there carries new information.
            if (kind !== MOUSE_MOTION) lastMotion = null;
            if (ws && ws.readyState === 1) ws.send(bytes);
            return true;
        }

        function sendMouseMotion(cell, e, button) {
            const mods = mouseMods(e);
            if (lastMotion && lastMotion.col === cell.col && lastMotion.row === cell.row &&
                lastMotion.button === button && lastMotion.mods === mods) return;
            lastMotion = { col: cell.col, row: cell.row, button, mods };
            sendMouseEvent(MOUSE_MOTION, button, cell, e);
        }

        // xterm: Shift held on press bypasses mouse reporting and selects
        // natively instead (its mac option only affects macOS and defaults
        // to off, so Shift is the whole story).
        function forceNativeSelection(e) {
            return e.shiftKey;
        }

        window.addEventListener('mousedown', (e) => {
            if (e.button > 2) return; // back/forward buttons: not reported, no selection
            if (scrollbarEl.contains(e.target)) return; // the scrollbar owns its own drag
            const cell = cellFromPoint(e.clientX, e.clientY);
            if ((isMac ? e.metaKey : e.ctrlKey) && e.button === 0) {
                // OSC 8: modifier-click opens the hyperlink under the cursor
                // instead of reporting the click to the app.
                const uri = callStringExport(hyperlink_at, cell.row, cell.col);
                if (uri) {
                    e.preventDefault();
                    window.open(uri, '_blank', 'noopener,noreferrer');
                    return;
                }
            }
            if (mouse_tracking() === 1 && !forceNativeSelection(e)) {
                e.preventDefault();
                mousePhase = 'capture';
                clear_selection(); // a click in the app dismisses any old highlight
                sendMouseEvent(MOUSE_PRESS, e.button, cell, e);
                return;
            }
            if (e.button !== 0) return;
            mousePhase = 'select';
            selDragging = true;
            selMoved = false;
            selAnchor = cell;
        });

        window.addEventListener('mousemove', (e) => {
            const cell = cellFromPoint(e.clientX, e.clientY);
            // Show a pointer over OSC 8 links while the open modifier is held.
            const modLink = isMac ? e.metaKey : e.ctrlKey;
            canvas.style.cursor =
                modLink && callStringExport(hyperlink_at, cell.row, cell.col) ? 'pointer' : '';
            if (mousePhase === 'capture') {
                // Report motion only while a button is actually held; the
                // protocol filter in wasm drops it if the app did not ask
                // for drag/hover reports.
                if (e.buttons) sendMouseMotion(cell, e, heldButton(e));
                return;
            }
            if (mousePhase === 'select') {
                if (!selAnchor) return;
                if (cell.row !== selAnchor.row || cell.col !== selAnchor.col) selMoved = true;
                if (selMoved) { set_selection(selAnchor.row, selAnchor.col, cell.row, cell.col); repaint(); }
                return;
            }
            // Hover: reported only when the app enabled any-motion tracking
            // (1003); the wasm side drops it under every other protocol.
            if (mouse_tracking() === 1) sendMouseMotion(cell, e, 3);
        });

        window.addEventListener('mouseup', (e) => {
            if (mousePhase === 'capture') {
                sendMouseEvent(MOUSE_RELEASE, e.button, cellFromPoint(e.clientX, e.clientY), e);
                // Keep capturing while other buttons are still held down.
                if (!e.buttons) mousePhase = 'idle';
                return;
            }
            if (e.button !== 0 || !selDragging) return;
            selDragging = false;
            mousePhase = 'idle';
            if (!selMoved) {
                clear_selection();
                repaint();
                handle_click(e.clientX, e.clientY);
                selAnchor = null;
                return;
            }
            selMoved = false;
            const end = cellFromPoint(e.clientX, e.clientY);
            set_selection(selAnchor.row, selAnchor.col, end.row, end.col);
            repaint();
            selAnchor = null;
            const text = callStringExport(selected_text);
            if (text) {
                try { navigator.clipboard.writeText(text); showStatus('copied ' + text.length + ' chars'); } catch (_) {}
            }
        });

        // A right-click is reported to the app while a protocol is active, so
        // keep the browser's context menu out of the way. Without a protocol
        // the menu is harmless and stays.
        window.addEventListener('contextmenu', (e) => {
            if (mouse_tracking() === 1) e.preventDefault();
        });

        window.addEventListener('auxclick', (e) => {
            if (e.button !== 1) return;
            e.preventDefault();
            // Middle press/release already went to the app as mouse reports.
            if (mouse_tracking() === 1) return;
            navigator.clipboard.readText().then((t) => {
                if (t) sendPaste(t);
            }).catch(() => {});
        });

        let touchSel = null;
        let touchTimer = null;
        window.addEventListener('touchstart', (e) => {
            if (e.touches.length !== 1) return;
            const t = e.touches[0];
            touchTimer = setTimeout(() => {
                touchTimer = null;
                touchSel = cellFromPoint(t.clientX, t.clientY);
                if (navigator.vibrate) navigator.vibrate(20);
            }, 450);
        }, { passive: true });

        window.addEventListener('touchmove', (e) => {
            if (!touchSel || e.touches.length !== 1) return;
            e.preventDefault();
            const t = e.touches[0];
            const cur = cellFromPoint(t.clientX, t.clientY);
            set_selection(touchSel.row, touchSel.col, cur.row, cur.col);
            repaint();
        }, { passive: false });

        window.addEventListener('touchend', (e) => {
            if (touchTimer) { clearTimeout(touchTimer); touchTimer = null; }
            if (!touchSel) return;
            touchSel = null;
            const text = callStringExport(selected_text);
            if (text) {
                try { navigator.clipboard.writeText(text); showStatus('copied ' + text.length + ' chars'); } catch (_) {}
            }
        });

        // Wheel deltas are not one-event-per-notch everywhere: clicky mice send a
        // single event per detent, but high-resolution wheels and trackpads send a
        // burst of small-delta events for the same physical rotation. A terminal
        // app scrolls 3 lines per button-64/65 report, so forwarding every event
        // verbatim turns one notch into a screenful on those devices. Accumulate
        // deltas into *detents* and emit one report per whole detent, carrying the
        // fractional remainder into the next event so slow scrolling still
        // advances one report at a time.
        //
        // Detents, not cell heights: measuring the delta against the cell height
        // made the scroll rate a function of the font — Chrome's 100px wheel unit
        // is ~6 cells tall, so one notch scrolled ~6 lines instead of 3. Detents
        // come from the browser's own units, so a notch is a notch at any size.
        const WHEEL_LINES_PER_REPORT = 3;
        const WHEEL_PIXELS_PER_DETENT = 100;
        const WHEEL_MAX_REPORTS = 5;
        let wheelAccDetents = 0;

        function wheelDetents(e) {
            if (e.deltaMode === 1) return e.deltaY / WHEEL_LINES_PER_REPORT;      // DOM_DELTA_LINE
            if (e.deltaMode === 2) return e.deltaY * gridRows / WHEEL_LINES_PER_REPORT; // DOM_DELTA_PAGE
            return e.deltaY / WHEEL_PIXELS_PER_DETENT;                              // DOM_DELTA_PIXEL
        }

        window.addEventListener('wheel', (e) => {
            e.preventDefault();
            wheelAccDetents += wheelDetents(e);
            const limit = WHEEL_MAX_REPORTS;
            if (wheelAccDetents > limit) wheelAccDetents = limit;
            else if (wheelAccDetents < -limit) wheelAccDetents = -limit;
            const reports = Math.trunc(wheelAccDetents);
            if (reports === 0) return;
            wheelAccDetents -= reports;
            if (!wasmReady) return;
            if (mouse_tracking() === 1) {
                // The app asked for the pointer: one button-64/65 report per
                // detent, at the cell under the pointer. The wasm side drops
                // wheel reports under protocols that do not want them (X10).
                const cell = cellFromPoint(e.clientX, e.clientY);
                const dir = reports < 0 ? 0 : 1; // 0 = up, 1 = down
                for (let i = 0; i < Math.abs(reports); i++) {
                    sendMouseEvent(MOUSE_WHEEL, dir, cell, e);
                }
                return;
            }
            if (scrollback_len() > 0) {
                // No protocol: scroll our own scrollback, the way xterm
                // scrolls its viewport. Positive delta = back in history.
                doScroll(-reports * WHEEL_LINES_PER_REPORT);
                return;
            }
            // Nothing to scroll locally (a full-screen app that did not opt
            // into mouse reporting): turn the wheel into arrow keys, exactly
            // as xterm does — DECCKM picks the application-cursor form.
            const arrow = (application_cursor() === 1 ? '\x1bO' : '\x1b[') + (reports < 0 ? 'A' : 'B');
            if (ws && ws.readyState === 1) {
                ws.send(new TextEncoder().encode(arrow.repeat(Math.abs(reports))));
            }
        }, { passive: false });

        scrollbarEl.addEventListener('wheel', (e) => {
            e.stopPropagation();
        }, { passive: false });

        scrollbarEl.addEventListener('mousedown', (e) => {
            e.preventDefault();
            const track = scrollbarEl.getBoundingClientRect();
            const max = scrollback_len();
            const frac = 1 - (e.clientY - track.top) / track.height;
            let offset = max > 0 ? Math.round(frac * max) : 0;
            doScrollTo(offset);
            const onMove = (ev) => {
                const f = 1 - (ev.clientY - track.top) / track.height;
                doScrollTo(max > 0 ? Math.round(f * max) : 0);
            };
            const onUp = () => {
                window.removeEventListener('mousemove', onMove);
                window.removeEventListener('mouseup', onUp);
            };
            window.addEventListener('mousemove', onMove);
            window.addEventListener('mouseup', onUp);
        });
    </script>
</body>
</html>
