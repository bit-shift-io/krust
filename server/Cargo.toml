[package]
name = "krust"
version = "0.1.0"
edition = "2021"

[dependencies]
tokio = { version = "1.0", features = ["macros", "rt-multi-thread", "net", "sync"] }
axum = { version = "0.7", features = ["ws"] }
portable-pty = "0.8"
tower-http = { version = "0.5", features = ["cors"] }
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
# Mirror parser for the session screen: the server replays a synthesized
# screen image (from vt100's own state diff) so a client replay never depends
# on a byte log trimmed mid-stream.
vt100 = "0.16"

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
