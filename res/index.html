<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8" />
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%232b2b2b'/%3E%3Cpath d='M8 10L14 16L8 22' stroke='%23f0f0f0' stroke-width='2.5' stroke-linecap='round' stroke-linejoin='round' fill='none'/%3E%3Cline x1='16' y1='22' x2='24' y2='22' stroke='%23f0f0f0' stroke-width='2.5' stroke-linecap='round'/%3E%3C/svg%3E">
    <link rel="stylesheet" href="/res/xterm.css" />
    <script src="/res/xterm.js"></script>
    <script src="/res/xterm-addon-fit.js"></script>
    <script src="/res/xterm-addon-webgl.js"></script>
    <style>
        * { box-sizing: border-box; }
        body, html {
            margin: 0;
            padding: 0;
            height: 100vh;
            width: 100vw;
            background: #2b2b2b;
            overflow: hidden;
        }
        #terminal {
            width: 100vw;
            height: 100vh;
            background: #2b2b2b;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .xterm, .xterm-viewport {
            background-color: inherit !important;
        }
        .xterm-screen {
            margin: auto !important;
        }
    </style>
</head>
<body>
    <div id="terminal"></div>
    <script>
        // 1. Check URL query parameters first, fallback to sessionStorage (isolated per tab)
        const urlParams = new URLSearchParams(window.location.search);
        let sessionId = urlParams.get('s') || urlParams.get('session');

        if (!sessionId) {
            sessionId = sessionStorage.getItem('term_session_id');
        }

        if (!sessionId) {
            sessionId = Math.random().toString(36).substring(2, 6);
            sessionStorage.setItem('term_session_id', sessionId);
        }

        // 2. Reflect session ID in URL without reloading so you can bookmark/copy standard links
        const reflected = urlParams.get('s') || urlParams.get('session');
        if (reflected !== sessionId) {
            const newUrl = new URL(window.location);
            newUrl.searchParams.set('s', sessionId);
            newUrl.searchParams.delete('session');
            window.history.replaceState({}, '', newUrl);
        }

        const theme = {
            background: '#2b2b2b',
            foreground: '#f0f0f0',
            cursor: '#f0f0f0',
            selectionBackground: 'rgba(255, 255, 255, 0.3)'
        };

        // Cap animation frame rate to ~30fps to reduce GPU load / coil whine.
        const FRAME_INTERVAL_MS = 33;
        const nativeRaf = window.requestAnimationFrame.bind(window);
        let lastFrameAt = 0;
        window.requestAnimationFrame = (cb) => nativeRaf((now) => {
            if (now - lastFrameAt >= FRAME_INTERVAL_MS) {
                lastFrameAt = now;
                cb(now);
            } else {
                window.requestAnimationFrame(cb);
            }
        });

        const term = new Terminal({
            cursorBlink: true,
            fontSize: 14,
            lineHeight: 1,
            letterSpacing: 0,
            fontFamily: 'JetBrains Mono, Fira Code, monospace',
            customGlyphs: false,
            minimumContrastRatio: 1,
            theme: theme
        });

        const fitAddon = new FitAddon.FitAddon();
        term.loadAddon(fitAddon);

        const container = document.getElementById('terminal');
        term.open(container);
        term.focus();

        // Keyboard Shortcuts Handler
        term.attachCustomKeyEventHandler(e => {
            if (e.type !== 'keydown') return true;

            const isMac = navigator.platform.toUpperCase().indexOf('MAC') >= 0;
            const modifier = isMac ? e.metaKey : e.ctrlKey;

            // 1. Shift + Enter -> Send exact Alt+Enter sequence (\x1b\r) and block textarea newline
            if (e.key === 'Enter' && e.shiftKey && !e.ctrlKey && !e.altKey && !e.metaKey) {
                e.preventDefault();
                if (socket && socket.readyState === WebSocket.OPEN) {
                    socket.send(JSON.stringify({ type: "Input", data: "\x1b\r" }));
                }
                return false;
            }

            // 2. Ctrl + Enter -> Send CSI u sequence (\x1b[13;5u)
            if (e.key === 'Enter' && modifier && !e.shiftKey && !e.altKey) {
                e.preventDefault();
                if (socket && socket.readyState === WebSocket.OPEN) {
                    socket.send(JSON.stringify({ type: "Input", data: "\x1b[13;5u" }));
                }
                return false;
            }

            // 3. Smart Copy: Ctrl+C / Cmd+C
            if (modifier && e.key.toLowerCase() === 'c' && !e.altKey) {
                if (term.hasSelection()) {
                    e.preventDefault();
                    navigator.clipboard.writeText(term.getSelection());
                    term.clearSelection();
                    return false;
                }
                if (e.shiftKey) return false;
                return true; // Let Ctrl+C pass through to shell as SIGINT (\x03)
            }

            // 4. Paste: Shift+Insert / Ctrl+Shift+V / Cmd+V
            const isShiftInsert = e.shiftKey && e.key === 'Insert';
            const isCtrlShiftV = modifier && e.shiftKey && e.key.toLowerCase() === 'v';
            const isMacCmdV = isMac && e.metaKey && e.key.toLowerCase() === 'v';

            if (isShiftInsert || isCtrlShiftV || isMacCmdV) {
                e.preventDefault();
                navigator.clipboard.readText().then(text => {
                    if (text && socket && socket.readyState === WebSocket.OPEN) {
                        sendPasteInChunks(text);
                    }
                }).catch(err => {
                    console.warn("Clipboard read permission denied or unavailable", err);
                });
                return false;
            }

            // 5. Select All: Ctrl+Shift+A / Cmd+Shift+A
            if (modifier && e.shiftKey && e.key.toLowerCase() === 'a') {
                e.preventDefault();
                term.selectAll();
                return false;
            }

            // 6. Toggle WebGL rendering: Ctrl+Shift+G / Cmd+Shift+G
            if (modifier && e.shiftKey && e.key.toLowerCase() === 'g') {
                e.preventDefault();
                toggleWebgl();
                return false;
            }

            return true;
        });

        let webglAddon = null;

        try {
            webglAddon = new WebglAddon.WebglAddon();
            webglAddon.onContextLoss(() => webglAddon && webglAddon.dispose());
            term.loadAddon(webglAddon);
        } catch (e) {
            console.warn("WebGL initialization failed, falling back to standard canvas", e);
        }

        function toggleWebgl() {
            if (webglAddon) {
                try {
                    webglAddon.dispose();
                } catch (e) {
                    console.warn("Failed to dispose WebGL addon", e);
                }
                webglAddon = null;
                console.log("WebGL rendering disabled, using canvas renderer");
            } else if (window.WebglAddon) {
                try {
                    webglAddon = new WebglAddon.WebglAddon();
                    webglAddon.onContextLoss(() => webglAddon && webglAddon.dispose());
                    term.loadAddon(webglAddon);
                    console.log("WebGL rendering enabled");
                } catch (e) {
                    webglAddon = null;
                    console.warn("WebGL initialization failed", e);
                }
            }
            term.refresh(0, term.rows - 1);
        }

        fitAddon.fit();

        term.onTitleChange(title => {
            document.title = title;
        });

        let socket = null;
        let reconnectTimer = null;
        let reconnectDelay = 1000;
        let onDataDisposable = null;
        let isReconnecting = false;

        function sendSize() {
            if (socket && socket.readyState === WebSocket.OPEN) {
                const core = term._core;
                const cellWidth = core._renderService?.dimensions?.actualCellWidth || 9;
                const cellHeight = core._renderService?.dimensions?.actualCellHeight || 17;

                socket.send(JSON.stringify({
                    type: "Resize",
                    cols: term.cols,
                    rows: term.rows,
                    pixel_width: Math.floor(term.cols * cellWidth),
                    pixel_height: Math.floor(term.rows * cellHeight)
                }));
            }
        }

        function sendPasteInChunks(text) {
            const CHUNK_SIZE = 4096;
            const DELAY_MS = 5;
            let offset = 0;

            function sendNextChunk() {
                if (offset >= text.length) return;
                const chunk = text.slice(offset, offset + CHUNK_SIZE);
                offset += CHUNK_SIZE;
                if (socket && socket.readyState === WebSocket.OPEN) {
                    socket.send(JSON.stringify({ type: "Input", data: chunk }));
                }
                if (offset < text.length) {
                    setTimeout(sendNextChunk, DELAY_MS);
                }
            }
            sendNextChunk();
        }

        function connect() {
            const protocol = location.protocol === 'https:' ? 'wss:' : 'ws:';
            socket = new WebSocket(`${protocol}//${location.host}/ws?session_id=${encodeURIComponent(sessionId)}`);

            socket.onopen = () => {
                reconnectDelay = 1000;
                if (reconnectTimer) {
                    clearTimeout(reconnectTimer);
                    reconnectTimer = null;
                }

                if (isReconnecting) {
                    term.clear();
                    isReconnecting = false;
                }

                sendSize();
                term.focus();

                if (onDataDisposable) onDataDisposable.dispose();
                onDataDisposable = term.onData(data => {
                    if (socket.readyState === WebSocket.OPEN) {
                        socket.send(JSON.stringify({ type: "Input", data }));
                    }
                });
            };

            socket.onmessage = (e) => term.write(e.data);

            socket.onclose = () => {
                if (onDataDisposable) {
                    onDataDisposable.dispose();
                    onDataDisposable = null;
                }
                isReconnecting = true;
                scheduleReconnect();
            };

            socket.onerror = () => {
                socket.close();
            };
        }

        function scheduleReconnect() {
            if (!reconnectTimer) {
                reconnectTimer = setTimeout(() => {
                    reconnectTimer = null;
                    connect();
                }, reconnectDelay);
                reconnectDelay = Math.min(reconnectDelay * 1.5, 10000);
            }
        }

        connect();

        const resizeObserver = new ResizeObserver(() => {
            fitAddon.fit();
            sendSize();
        });
        resizeObserver.observe(container);

        function refitTerminal() {
            fitAddon.fit();
            sendSize();
            term.focus();
            term.refresh(0, term.rows - 1);
        }

        window.addEventListener('focus', () => {
            refitTerminal();
            if (!socket || socket.readyState === WebSocket.CLOSED) {
                connect();
            }
        });

        document.addEventListener('visibilitychange', () => {
            if (!document.hidden) {
                refitTerminal();
                if (!socket || socket.readyState === WebSocket.CLOSED) {
                    connect();
                }
            }
        });

        let refitRaf = null;
        function scheduleRefit() {
            if (refitRaf) return;
            refitRaf = requestAnimationFrame(() => {
                refitRaf = null;
                if (!document.hidden && socket?.readyState === WebSocket.OPEN) {
                    refitTerminal();
                }
            });
        }

        window.addEventListener('resize', scheduleRefit);

        window.addEventListener('wheel', (e) => {
            if (e.ctrlKey) {
                e.preventDefault();
                e.stopImmediatePropagation();

                let currentSize = term.options.fontSize || 14;
                let newSize = e.deltaY < 0 ? currentSize + 1 : currentSize - 1;
                newSize = Math.max(8, Math.min(32, newSize));

                if (newSize !== currentSize) {
                    term.options.fontSize = newSize;
                    fitAddon.fit();
                    sendSize();
                }
            }
        }, { capture: true, passive: false });
    </script>
</body>
</html>
