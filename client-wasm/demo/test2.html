<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>krust glue-API probe</title>
<style>
html, body { margin: 0; height: 100%; }
canvas { display: block; }
</style>
</head>
<body id="body" style="background:#888">
<canvas id="terminal-canvas" width="800" height="600"></canvas>
<img id="hold" style="display:none" src="/demo/slow.png">
<script type="module">
function ping(s){ fetch('/demo/step?p=' + s).then(()=>{}).catch(()=>{}); }
const body = document.getElementById('body');
window.addEventListener('error', e => { ping('PAGEERR ' + e.message); });
window.addEventListener('unhandledrejection', e => { ping('REJECT ' + e.reason); });
import init, {
    init2, init3, strlen, version, state_set, last_err_len, last_err_byte,
    arg_len, arg_byte, diag_grid, diag_canvas, diag_cell, resize2, process2
} from '../pkg/terminal_client.js';
try {
    const bytes = await (await fetch('../pkg/terminal_client_bg.wasm')).arrayBuffer();
    await init(bytes);
    ping('strlen ' + strlen('terminal-canvas'));
    const v = version();
    ping('ver ' + v.length + ' [' + v + ']');
    const i2 = init2('terminal-canvas');
    ping('init2 ' + i2);
    const al = arg_len();
    let arg = '';
    for (let i = 0; i < al; i++) arg += String.fromCharCode(arg_byte(i));
    ping('ARG len ' + al + ' [' + arg + ']');
    const l = last_err_len();
    let msg = '';
    for (let i = 0; i < l; i++) msg += String.fromCharCode(last_err_byte(i));
    if (l > 0) ping('ERR ' + msg);
    ping('sset ' + state_set());
    const g = diag_grid(), c = diag_canvas(), ce = diag_cell();
    ping('d1g ' + (g>>>0).toString(16) + ' c ' + (c>>>0).toString(16) + ' cell ' + (ce>>>0).toString(16));
    const rs = resize2(800, 600);
    ping('resize2 ' + rs);
    const g2 = diag_grid(), c2 = diag_canvas(), ce2 = diag_cell();
    ping('d2g ' + (g2>>>0).toString(16) + ' c ' + (c2>>>0).toString(16) + ' cell ' + (ce2>>>0).toString(16));
    const pr = process2(new TextEncoder().encode('Hello World\x1b[31m red\x1b[0m'));
    ping('proc2 ' + pr);
    const gl = document.getElementById('terminal-canvas').getContext('webgl2');
    const px = new Uint8Array(800 * 600 * 4);
    gl.readPixels(0, 0, 800, 600, gl.RGBA, gl.UNSIGNED_BYTE, px);
    let bright = 0, colored = 0;
    for (let i = 0; i < px.length; i += 4) {
        if (px[i] > 120 || px[i+1] > 120 || px[i+2] > 120) bright++;
        if (!(px[i] === px[i+1] && px[i+1] === px[i+2])) colored++;
    }
    ping('bright ' + bright + ' ' + colored);
    body.style.background = bright > 100 ? '#0a0' : '#f00';
    ping('end');
} catch (e) {
    body.style.background = '#f00';
    ping('ERR ' + String(e));
}
</script>
</body>
</html>
