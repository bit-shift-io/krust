<!DOCTYPE html>
<html>
<head><meta charset="utf-8"><title>real init timing</title></head>
<body>
<div id="s">loading</div>
<script type="module">
    dump('[ri] start\n');
    const iv = setInterval(() => dump('[ri] tick ' + performance.now().toFixed(0) + '\n'), 2000);
    const m = await import('../pkg/terminal_client.js');
    dump('[ri] imported, running default()... \n');
    const t0 = performance.now();
    await m.default();
    dump('[ri] default() done in ' + (performance.now() - t0).toFixed(0) + 'ms\n');
    clearInterval(iv);
    document.getElementById('s').textContent = 'done';
</script>
</body>
</html>
