<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <style>html, body { margin: 0; height: 100%; background: #000; }</style>
</head>
<body>
    <canvas id="terminal-canvas" width="800" height="600"></canvas>
    <script>
        var t0 = Date.now();
        var at = function (s) { try { dump('[' + (Date.now() - t0) + 'ms] ' + s + '\n'); } catch (e) {} };
        var mark = function (c) { document.body.style.backgroundColor = c; };
        (async function () {
            try {
                at('start');
                var m = await import('../pkg/terminal_client.js');
                at('glue');
                mark('#f0f0f0');
                var mod = await WebAssembly.compile(await (await fetch('../pkg/terminal_client_bg.wasm')).arrayBuffer());
                var wasm = m.initSync(mod);
                at('sync');
                mark('#f80');
                var r1 = wasm.init('terminal-canvas', null);
                at('init ' + r1);
                mark('#08f');
                var r2 = (function () { try { wasm.handle_resize(800, 600); return 'ok'; } catch (e) { return 'err:' + e; } })();
                at('resize ' + r2);
                mark('#f0f');
                var r3 = wasm.process_bytes(new TextEncoder().encode('Hello World\x1b[31m red\x1b[0m'));
                at('proc ' + r3);
                mark('#0a0');
                document.title = 'SUCCESS ' + r1 + ' / ' + r3;
            } catch (e) {
                at('ERR ' + e);
                mark('#f00');
            }
        })();
    </script>
</body>
</html>
