<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%232b2b2b'/%3E%3Cpath d='M8 10L14 16L8 22' stroke='%23f0f0f0' stroke-width='2.5' stroke-linecap='round' stroke-linejoin='round' fill='none'/%3E%3Cline x1='16' y1='22' x2='24' y2='22' stroke='%23f0f0f0' stroke-width='2.5' stroke-linecap='round'/%3E%3C/svg%3E">
    <title>krust terminal</title>
    <style>
        html, body { margin: 0; height: 100%; background: #111; overflow: hidden; }
        canvas { display: block; width: 100%; height: 100%; background: #000; }
        #status { position: fixed; bottom: 8px; left: 8px; z-index: 10; font: 12px monospace; color: #0f0; background: rgba(0,0,0,0.7); padding: 4px 8px; }
        body.done { background: #0a0; }
        body.done.fail { background: #a00; }
    </style>
</head>
<body>
    <canvas id="terminal-canvas" width="800" height="600" tabindex="0"></canvas>
    <img src="/demo/slow.png" style="display:none">
    <div id="status">loading...</div>
    <script type="module">
        import init, { init as term_init, process_bytes, handle_resize, handle_click, version } from '../pkg/terminal_client.js';
        import ping from './ping.js';
        const status = document.getElementById('status');
        const canvas = document.getElementById('terminal-canvas');
        try {
            ping('start');
            const bytes = await (await fetch('../pkg/terminal_client_bg.wasm')).arrayBuffer();
            await init(bytes);
            ping('glue');
            const ver = version();
            term_init('terminal-canvas', null);
            ping('init');
            handle_resize(800, 600);
            ping('resize');
            canvas.addEventListener('click', (e) => {
                const rect = canvas.getBoundingClientRect();
                const x = e.clientX - rect.left;
                const y = e.clientY - rect.top;
                handle_click(Math.round(x), Math.round(y));
            });
            canvas.style.pointerEvents = 'auto';
            ping('resize');
            process_bytes(new TextEncoder().encode('Hello World\x1b[31m red\x1b[0m'));
            ping('proc');
            const gl = canvas.getContext('webgl2');
            const px = new Uint8Array(canvas.width * canvas.height * 4);
            gl.readPixels(0, 0, canvas.width, canvas.height, gl.RGBA, gl.UNSIGNED_BYTE, px);
            let bright = 0, colored = 0;
            for (let i = 0; i < px.length; i += 4) {
                const r = px[i], g = px[i + 1], b = px[i + 2];
                if (r > 120 || g > 120 || b > 120) bright++;
                if (r !== g || g !== b) colored++;
            }
            const ok = bright > 100;
            ping('bright=' + bright + ' colored=' + colored + ' ver=' + ver);
            document.body.className = 'done' + (ok ? '' : ' fail');
            status.textContent = 'bright=' + bright + ' colored=' + colored + ' ' + ver + (ok ? ' PASS' : ' FAIL');
        } catch (e) {
            document.body.className = 'done fail';
            status.textContent = 'ERR ' + e;
            ping('err ' + e);
        }
    </script>
</body>
</html>
