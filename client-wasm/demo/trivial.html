<!DOCTYPE html>
<html>
<head><meta charset="utf-8"><title>trivial import test</title></head>
<body>
<div id="s">loading</div>
<script type="module">
    dump('[triv] before import\n');
    try {
        const m = await import('../pkg/terminal_client.js');
        dump('[triv] import ok keys=' + Object.keys(m).length + '\n');
        await m.default();
        dump('[triv] wasm-init ok\n');
        document.getElementById('s').textContent = 'OK ' + Object.keys(m).length;
    } catch (e) {
        dump('[triv] FAIL ' + (e && (e.stack || e.message || JSON.stringify(e))) + '\n');
        document.getElementById('s').textContent = 'FAIL ' + e;
    }
</script>
</body>
</html>
