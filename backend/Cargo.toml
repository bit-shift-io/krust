[package]
name = "terminal-backend"
version = "0.1.0"
edition = "2021"

[features]
new-terminal = []

[dependencies]
tokio = { version = "1.0", features = ["full"] }
axum = { version = "0.7", features = ["ws"] }
portable-pty = "0.8"
tower-http = { version = "0.5", features = ["cors"] }
futures-util = "0.3"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"